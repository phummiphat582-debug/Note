<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeNote</title>
<link rel="manifest" href="/Note/manifest.json">
<meta name="theme-color" content="#0e639c">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a1a1b;font-family:Consolas,'SF Mono',monospace;overflow:hidden}
.app{display:flex;height:100vh}

/* sidebar */
.sidebar{width:220px;background:#202021;color:#ccc;display:flex;flex-direction:column;border-right:1px solid #333;flex-shrink:0}
.sidebar-top{padding:10px 12px 6px;display:flex;align-items:center;justify-content:space-between}
.sidebar-top span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#666}
.file-list{flex:1;overflow-y:auto;overflow-x:hidden}
.file-list::-webkit-scrollbar{width:4px}
.file-list::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
.file-item{display:flex;align-items:center;padding:7px 10px;cursor:pointer;gap:6px;transition:background .12s;border-left:2px solid transparent}
.file-item:hover{background:#2a2a2b}
.file-item.active{background:#2e2e30;border-left-color:#0e639c;color:#fff}
.file-item .name{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .del{opacity:0;color:#666;font-size:11px;padding:2px 4px;border-radius:3px;transition:opacity .15s;cursor:pointer;flex-shrink:0}
.file-item:hover .del{opacity:1}
.file-item .del:hover{color:#ef4444;background:#2f1515}
.new-btn{margin:8px;padding:7px 10px;background:#0e639c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;transition:background .15s;text-align:left;display:flex;align-items:center;gap:6px}
.new-btn:hover{background:#1177b0}
.new-btn:active{transform:scale(.98)}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* topbar */
.topbar{height:40px;background:#202021;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #2e2e30;flex-shrink:0;gap:8px}
.tab-name{font-size:12.5px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.toolbar{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tb-btn{background:transparent;color:#aaa;border:none;padding:4px 7px;border-radius:4px;cursor:pointer;font-size:12px;transition:background .12s,color .12s;white-space:nowrap}
.tb-btn:hover{background:#2e2e30;color:#fff}
.tb-btn:active{transform:scale(.96)}
.tb-sep{width:1px;height:16px;background:#333;margin:0 2px}
.tb-select{background:#2e2e30;color:#ccc;border:1px solid #3a3a3c;padding:3px 5px;border-radius:4px;font-size:11.5px;cursor:pointer;font-family:inherit}
.tb-select:focus{outline:none;border-color:#0e639c}
.tb-color{width:26px;height:22px;border:1px solid #3a3a3c;border-radius:4px;cursor:pointer;padding:1px;background:#2e2e30}

/* status bar */
.statusbar{height:22px;background:#0e639c;display:flex;align-items:center;padding:0 12px;gap:16px;flex-shrink:0}
.status-item{font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap}
.status-item.save-ok{color:#7ee787}
.status-item.saving{color:#fbbf24}

/* editor area */
.editor-wrap{flex:1;overflow:auto;position:relative}
.editor-wrap::-webkit-scrollbar{width:8px}
.editor-wrap::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.editor-wrap::-webkit-scrollbar-thumb:hover{background:#444}
.editor{min-height:100%;padding:28px 36px;color:#d4d4d4;font-size:14px;outline:none;white-space:pre-wrap;line-height:1.8;caret-color:#0e639c;word-break:break-word}
.editor:empty::before{content:attr(data-placeholder);color:#444;pointer-events:none}

/* drag over */
.editor-wrap.dragover{outline:2px dashed #0e639c;outline-offset:-4px}

/* image */
.img-box{display:inline-block;position:relative;vertical-align:middle;margin:2px}
.img-box img{display:block;border-radius:4px}
.img-box .handle{position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;background:#0e639c;cursor:nwse-resize;border-radius:50%;opacity:.8}
.img-box .handle:hover{opacity:1}
.img-box .del-img{position:absolute;top:-6px;right:-6px;width:14px;height:14px;background:#ef4444;color:#fff;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;line-height:1}
.img-box:hover .del-img{opacity:1}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(2px)}
.overlay.show{display:flex}
.modal{background:#252526;border:1px solid #3a3a3c;border-radius:10px;width:360px;animation:popIn .15s ease}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:14px 16px 10px;font-size:13px;font-weight:600;color:#e5e5e5;border-bottom:1px solid #333}
.modal-body{padding:14px 16px}
.modal-body input{width:100%;padding:9px 11px;background:#1e1e1f;color:#e5e5e5;border:1px solid #3a3a3c;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.modal-body input:focus{border-color:#0e639c}
.modal-foot{padding:10px 16px 14px;display:flex;justify-content:flex-end;gap:8px}
.mbtn{padding:6px 14px;border:none;cursor:pointer;border-radius:6px;font-size:12px;transition:opacity .12s,transform .1s;font-family:inherit}
.mbtn:hover{opacity:.85}
.mbtn:active{transform:scale(.97)}
.mbtn-ok{background:#0e639c;color:#fff}
.mbtn-del{background:#dc2626;color:#fff}
.mbtn-cancel{background:#3a3a3c;color:#ccc}

/* sound indicator */
.sound-dot{width:6px;height:6px;border-radius:50%;background:#7ee787;display:inline-block;margin-right:4px;vertical-align:middle}
.sound-dot.off{background:#555}

@media print{
  .sidebar,.topbar,.statusbar{display:none!important}
  .app,.main{display:block!important}
  .editor{color:#000!important;font-size:12pt!important;padding:30px!important;white-space:pre-wrap!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-top">
      <span>Files</span>
    </div>
    <div class="file-list" id="fileList"></div>
    <button class="new-btn" onclick="openCreate()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      New File
    </button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="tab-name" id="tabName">note</div>
      <div class="toolbar">
        <select class="tb-select" onchange="setFontSize(this.value)" title="Font size">
          <option value="">Size</option>
          <option value="11px">11</option>
          <option value="12px">12</option>
          <option value="14px">14</option>
          <option value="16px">16</option>
          <option value="18px">18</option>
          <option value="22px">22</option>
          <option value="28px">28</option>
          <option value="36px">36</option>
        </select>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="cmd('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="tb-btn" onclick="cmd('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
        <button class="tb-btn" onclick="cmd('underline')" title="Underline (Ctrl+U)"><u>U</u></button>
        <button class="tb-btn" onclick="cmd('strikeThrough')" title="Strikethrough"><s>S</s></button>
        <button class="tb-btn" onclick="doHighlight()" title="Highlight selected text">HL</button>
        <input class="tb-color" type="color" onchange="setColor(this.value)" title="Text color" value="#ff6b6b">
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="cmd('insertUnorderedList')" title="Bullet list">• List</button>
        <button class="tb-btn" onclick="addImage()" title="Insert image (or drag & drop / paste)">IMG</button>
        <button class="tb-btn" onclick="printPage()" title="Print / Save as PDF">PDF</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" id="soundBtn" onclick="toggleSound()" title="Toggle keyboard sound">
          <span class="sound-dot" id="soundDot"></span>SFX
        </button>
      </div>
    </div>

    <div class="editor-wrap" id="editorWrap">
      <div id="editor" class="editor" contenteditable="true"
           data-placeholder="เริ่มพิมพ์ได้เลย... (Ctrl+B Bold · Ctrl+I Italic · Ctrl+S Save · Ctrl+N ไฟล์ใหม่ · ลากรูปวางได้โดยตรง)">
      </div>
    </div>

    <div class="statusbar">
      <span class="status-item save-ok" id="saveStatus">Saved</span>
      <span class="status-item" id="wordCount">0 words</span>
      <span class="status-item" id="cursorPos">Ln 1</span>
      <span class="status-item" id="charCount">0 chars</span>
    </div>
  </div>
</div>

<input type="file" id="imageInput" accept="image/*" hidden multiple>

<!-- Create modal -->
<div class="overlay" id="createModal">
  <div class="modal">
    <div class="modal-head">สร้างไฟล์ใหม่</div>
    <div class="modal-body">
      <input id="nameInput" placeholder="ชื่อไฟล์" autocomplete="off">
    </div>
    <div class="modal-foot">
      <button class="mbtn mbtn-cancel" onclick="closeModals()">ยกเลิก</button>
      <button class="mbtn mbtn-ok" onclick="confirmCreate()">ตกลง</button>
    </div>
  </div>
</div>

<!-- Delete modal -->
<div class="overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-head">ยืนยันการลบ</div>
    <div class="modal-body" id="deleteText" style="color:#ccc;font-size:13px;line-height:1.6"></div>
    <div class="modal-foot">
      <button class="mbtn mbtn-cancel" onclick="closeModals()">ยกเลิก</button>
      <button class="mbtn mbtn-del" onclick="confirmDelete()">ลบ</button>
    </div>
  </div>
</div>

<script>
/* =============================================
   AUDIO ENGINE — Dekey Galaxy 100 V2
   Gasket-mount + Linear switch "Thocky" profile
   
   Character:
   - Deep, low-frequency "thock" body (gasket resonance)
   - Smooth linear bottom-out (no tactile click)
   - Warm mid-range presence (foam dampening)
   - Very subtle case ping (aluminum top case)
   - Short, tight decay — not clicky, not mushy
   
   Layers:
   1. Sub-thud: very low sine (~55–90Hz) — the gasket mount body
   2. Thock body: low bandpass noise (~200–500Hz) — switch bottom-out
   3. Muffled mid: triangle wave (~350Hz) — foam + plate dampening
   4. Subtle case ping: short hi-freq sine (2.5kHz–1kHz) — aluminum resonance, very quiet
   ============================================= */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let soundOn = localStorage.getItem('cn_sfx') !== 'off';

function getACtx() {
  if (!actx) actx = new AudioCtx();
  return actx;
}

function playKey(isSpecial) {
  if (!soundOn) return;
  try {
    const ctx = getACtx();
    const t = ctx.currentTime;

    // Slight velocity randomisation — keeps it organic
    const vel = 0.78 + Math.random() * 0.22;         // 0.78–1.0
    const pitchShift = 1 + (Math.random() - 0.5) * 0.08; // ±4% pitch variation

    /* ── Layer 1: Sub-thud — gasket mount / plate flex ──
       Very low sine, punchy attack, quick decay ~55ms
       This is the "thock" depth that makes gasket mounts feel different */
    const osc1 = ctx.createOscillator();
    osc1.type = 'sine';
    const subFreq = isSpecial ? 58 : (72 + Math.random() * 18); // 72–90 Hz
    osc1.frequency.setValueAtTime(subFreq * pitchShift, t);
    osc1.frequency.exponentialRampToValueAtTime(subFreq * pitchShift * 0.55, t + 0.055);

    const env1 = ctx.createGain();
    env1.gain.setValueAtTime(0, t);
    env1.gain.linearRampToValueAtTime(0.52 * vel, t + 0.003);   // fast attack
    env1.gain.exponentialRampToValueAtTime(0.001, t + 0.058);   // quick decay

    osc1.connect(env1);
    env1.connect(ctx.destination);
    osc1.start(t);
    osc1.stop(t + 0.062);

    /* ── Layer 2: Thock body — noise burst through low-shelf ──
       Bandpass noise centered 250–380Hz = the "meat" of the sound
       Very short (35ms) for tightness, not mushiness */
    const bufLen = Math.floor(ctx.sampleRate * 0.035);
    const buf2 = ctx.createBuffer(1, bufLen, ctx.sampleRate);
    const d2 = buf2.getChannelData(0);
    for (let i = 0; i < bufLen; i++) d2[i] = Math.random() * 2 - 1;

    const noise2 = ctx.createBufferSource();
    noise2.buffer = buf2;

    const lpf2 = ctx.createBiquadFilter();
    lpf2.type = 'lowpass';
    lpf2.frequency.value = isSpecial ? 320 : (380 + Math.random() * 80); // 380–460 Hz
    lpf2.Q.value = 0.9;

    const hpf2 = ctx.createBiquadFilter();
    hpf2.type = 'highpass';
    hpf2.frequency.value = isSpecial ? 140 : 170;

    const env2 = ctx.createGain();
    env2.gain.setValueAtTime(0, t);
    env2.gain.linearRampToValueAtTime(0.38 * vel, t + 0.002);
    env2.gain.exponentialRampToValueAtTime(0.001, t + 0.036);

    noise2.connect(hpf2);
    hpf2.connect(lpf2);
    lpf2.connect(env2);
    env2.connect(ctx.destination);
    noise2.start(t);
    noise2.stop(t + 0.038);

    /* ── Layer 3: Muffled mid — foam damping character ──
       Triangle wave at low-mid frequency, soft envelope
       Simulates the "muted" resonance of foam + gasket */
    const osc3 = ctx.createOscillator();
    osc3.type = 'triangle';
    const midFreq = isSpecial ? 210 : (260 + Math.random() * 60); // 260–320 Hz
    osc3.frequency.setValueAtTime(midFreq * pitchShift, t);
    osc3.frequency.exponentialRampToValueAtTime(midFreq * pitchShift * 0.75, t + 0.045);

    const env3 = ctx.createGain();
    env3.gain.setValueAtTime(0, t);
    env3.gain.linearRampToValueAtTime(0.18 * vel, t + 0.004);
    env3.gain.exponentialRampToValueAtTime(0.001, t + 0.048);

    osc3.connect(env3);
    env3.connect(ctx.destination);
    osc3.start(t);
    osc3.stop(t + 0.052);

    /* ── Layer 4: Case ping — aluminum top case resonance ──
       Very quiet, fast sweep from 2.5kHz → 1.2kHz
       Gives it the subtle "premium" metallic quality without being clicky */
    const osc4 = ctx.createOscillator();
    osc4.type = 'sine';
    osc4.frequency.setValueAtTime(2500, t);
    osc4.frequency.exponentialRampToValueAtTime(1200, t + 0.018);

    const env4 = ctx.createGain();
    env4.gain.setValueAtTime(0, t);
    env4.gain.linearRampToValueAtTime(0.045 * vel, t + 0.001); // very quiet
    env4.gain.exponentialRampToValueAtTime(0.001, t + 0.020);

    osc4.connect(env4);
    env4.connect(ctx.destination);
    osc4.start(t);
    osc4.stop(t + 0.022);

    /* ── Layer 5 (special keys only): Stabiliser rattle ──
       Space / Enter / Backspace have slightly longer, looser feel
       Extra low noise burst — simulates stab rattle dampened by lube */
    if (isSpecial) {
      const bufS = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.028), ctx.sampleRate);
      const dS = bufS.getChannelData(0);
      for (let i = 0; i < dS.length; i++) dS[i] = (Math.random() * 2 - 1) * 0.6;

      const noiseS = ctx.createBufferSource();
      noiseS.buffer = bufS;

      const lpfS = ctx.createBiquadFilter();
      lpfS.type = 'lowpass';
      lpfS.frequency.value = 280;

      const envS = ctx.createGain();
      envS.gain.setValueAtTime(0, t + 0.004); // slight delay after main hit
      envS.gain.linearRampToValueAtTime(0.12 * vel, t + 0.008);
      envS.gain.exponentialRampToValueAtTime(0.001, t + 0.032);

      noiseS.connect(lpfS);
      lpfS.connect(envS);
      envS.connect(ctx.destination);
      noiseS.start(t + 0.004);
      noiseS.stop(t + 0.034);
    }

  } catch(e) { /* silent fail */ }
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('cn_sfx', soundOn ? 'on' : 'off');
  updateSoundBtn();
}

function updateSoundBtn() {
  document.getElementById('soundDot').className = 'sound-dot' + (soundOn ? '' : ' off');
  document.getElementById('soundBtn').title = soundOn ? 'คลิกเพื่อปิดเสียง (Dekey Galaxy 100 V2)' : 'คลิกเพื่อเปิดเสียง';
}
updateSoundBtn();

/* =============================================
   FILE SYSTEM
   ============================================= */
let files = {};
try { files = JSON.parse(localStorage.getItem('cn_files') || '{}'); } catch(e) { files = {}; }
let currentFile = null;
let deleteTarget = null;
let saveTimer = null;
let isDirty = false;

const editor    = document.getElementById('editor');
const fileList  = document.getElementById('fileList');
const tabName   = document.getElementById('tabName');
const imageInput = document.getElementById('imageInput');
const saveStatus = document.getElementById('saveStatus');

function scheduleSave() {
  isDirty = true;
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 800);
}

function doSave() {
  if (!currentFile || !isDirty) return;
  files[currentFile] = editor.innerHTML;
  try { localStorage.setItem('cn_files', JSON.stringify(files)); } catch(e) {
    setStatus('error');
    return;
  }
  isDirty = false;
  setStatus('saved');
}

function setStatus(s) {
  if (s === 'saving') {
    saveStatus.textContent = 'Saving...';
    saveStatus.className = 'status-item saving';
  } else if (s === 'error') {
    saveStatus.textContent = 'Save failed (storage full?)';
    saveStatus.className = 'status-item';
    saveStatus.style.color = '#ef4444';
  } else {
    saveStatus.textContent = 'Saved';
    saveStatus.className = 'status-item save-ok';
  }
}

let metricsTimer = null;
function scheduleMetrics() {
  if (metricsTimer) return;
  metricsTimer = setTimeout(() => {
    updateMetrics();
    metricsTimer = null;
  }, 250);
}

function updateMetrics() {
  const text = editor.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  document.getElementById('wordCount').textContent = words.toLocaleString() + ' words';
  document.getElementById('charCount').textContent = chars.toLocaleString() + ' chars';
}

/* =============================================
   FILE MANAGEMENT
   ============================================= */
function renderFiles() {
  fileList.innerHTML = '';
  Object.keys(files).forEach(n => {
    const d = document.createElement('div');
    d.className = 'file-item' + (n === currentFile ? ' active' : '');
    const safeName = n.replace(/'/g, "\\'");
    d.innerHTML = `<span class="name" title="${n}" onclick="openFile('${safeName}')">📄 ${n}</span>
                   <span class="del" onclick="askDelete('${safeName}')" title="ลบไฟล์">✕</span>`;
    fileList.appendChild(d);
  });
}

function openFile(n) {
  if (n === currentFile) return;
  doSave();
  currentFile = n;
  editor.innerHTML = files[n] || '';
  tabName.textContent = n;
  isDirty = false;
  setStatus('saved');
  renderFiles();
  attachResizeAll();
  updateMetrics();
  editor.focus();
}

/* =============================================
   KEYBOARD — SOUND + SHORTCUTS
   ============================================= */
editor.addEventListener('keydown', e => {
  const special = e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Delete' || e.key === ' ';
  playKey(special);

  if (e.key === 'Tab') {
    e.preventDefault();
    document.execCommand('insertText', false, '    ');
  }
});

editor.addEventListener('input', () => {
  scheduleSave();
  scheduleMetrics();
});

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 's') { e.preventDefault(); doSave(); }
  if (mod && e.key === 'n') { e.preventDefault(); openCreate(); }
  if (e.key === 'Escape') closeModals();
  if (e.key === 'Enter' && document.getElementById('createModal').classList.contains('show')) {
    e.preventDefault();
    confirmCreate();
  }
});

document.addEventListener('selectionchange', () => {
  try {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const range = sel.getRangeAt(0).cloneRange();
    range.selectNodeContents(editor);
    range.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
    const ln = range.toString().split('\n').length;
    document.getElementById('cursorPos').textContent = 'Ln ' + ln;
  } catch(e) {}
});

/* =============================================
   TEXT FORMATTING
   ============================================= */
function cmd(c) { editor.focus(); document.execCommand(c, false, null); }

function setFontSize(size) {
  if (!size) return;
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.getRangeAt(0).collapsed) return;
  const span = document.createElement('span');
  span.style.fontSize = size;
  try { sel.getRangeAt(0).surroundContents(span); scheduleSave(); } catch(e) {}
}

function setColor(color) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.getRangeAt(0).collapsed) return;
  const span = document.createElement('span');
  span.style.color = color;
  try { sel.getRangeAt(0).surroundContents(span); scheduleSave(); } catch(e) {}
}

function doHighlight() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || sel.getRangeAt(0).collapsed) return;
  const mark = document.createElement('mark');
  mark.style.cssText = 'background:#fef08a;color:#1a1a1b;border-radius:2px;padding:0 1px';
  try { sel.getRangeAt(0).surroundContents(mark); scheduleSave(); } catch(e) {}
}

/* =============================================
   IMAGE HANDLING
   ============================================= */
function addImage() { editor.focus(); imageInput.value = ''; imageInput.click(); }

imageInput.onchange = e => Array.from(e.target.files).forEach(insertImageFile);

function insertImageFile(file) {
  const r = new FileReader();
  r.onload = () => insertImageSrc(r.result, '180px');
  r.readAsDataURL(file);
}

function insertImageSrc(src, width) {
  width = width || '180px';
  const box = buildImgBox(src, width);
  const sel = window.getSelection();
  if (sel && sel.rangeCount) {
    const range = sel.getRangeAt(0);
    range.collapse(false);
    range.insertNode(box);
  } else {
    editor.appendChild(box);
  }
  enableResize(box.querySelector('img'), box.querySelector('.handle'));
  scheduleSave();
}

function buildImgBox(src, width) {
  const box = document.createElement('span');
  box.className = 'img-box';
  box.contentEditable = 'false';

  const img = document.createElement('img');
  img.src = src;
  img.style.width = width;
  img.style.maxWidth = '100%';

  const handle = document.createElement('span');
  handle.className = 'handle';
  handle.title = 'ลากเพื่อปรับขนาด';

  const delBtn = document.createElement('span');
  delBtn.className = 'del-img';
  delBtn.textContent = '✕';
  delBtn.title = 'ลบรูป';
  delBtn.onclick = () => { box.remove(); scheduleSave(); };

  box.appendChild(img);
  box.appendChild(handle);
  box.appendChild(delBtn);
  return box;
}

function enableResize(img, handle) {
  handle.onmousedown = e => {
    e.preventDefault();
    const startX = e.clientX;
    const startW = img.offsetWidth;

    const onMove = ev => {
      const newW = Math.max(40, startW + (ev.clientX - startX));
      img.style.width = newW + 'px';
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      scheduleSave();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
}

function attachResizeAll() {
  document.querySelectorAll('.img-box').forEach(b => {
    enableResize(b.querySelector('img'), b.querySelector('.handle'));
  });
}

/* =============================================
   DRAG & DROP
   ============================================= */
const editorWrap = document.getElementById('editorWrap');

editorWrap.addEventListener('dragover', e => {
  e.preventDefault();
  editorWrap.classList.add('dragover');
});
editorWrap.addEventListener('dragleave', e => {
  if (!editorWrap.contains(e.relatedTarget)) editorWrap.classList.remove('dragover');
});
editorWrap.addEventListener('drop', e => {
  e.preventDefault();
  editorWrap.classList.remove('dragover');

  const imageFiles = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  imageFiles.forEach(insertImageFile);

  if (imageFiles.length === 0) {
    const url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (url && /\.(png|jpe?g|gif|webp|svg|bmp)(\?.*)?$/i.test(url)) {
      insertImageSrc(url, '200px');
    }
  }
});

/* =============================================
   PASTE — image from clipboard
   ============================================= */
editor.addEventListener('paste', e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      e.preventDefault();
      insertImageFile(item.getAsFile());
      return;
    }
  }
});

/* =============================================
   MODALS
   ============================================= */
function openCreate() {
  document.getElementById('createModal').classList.add('show');
  setTimeout(() => {
    const inp = document.getElementById('nameInput');
    inp.value = '';
    inp.style.borderColor = '';
    inp.focus();
  }, 60);
}

function askDelete(n) {
  deleteTarget = n;
  document.getElementById('deleteText').innerHTML =
    `ลบไฟล์ <b style="color:#fff">"${n}"</b> ?<br><span style="color:#888;font-size:12px">การกระทำนี้ไม่สามารถย้อนกลับได้</span>`;
  document.getElementById('deleteModal').classList.add('show');
}

function closeModals() {
  document.getElementById('createModal').classList.remove('show');
  document.getElementById('deleteModal').classList.remove('show');
}

['createModal', 'deleteModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) {
    if (e.target === this) closeModals();
  });
});

function confirmCreate() {
  const inp = document.getElementById('nameInput');
  const n = inp.value.trim();
  if (!n) { inp.style.borderColor = '#ef4444'; inp.focus(); return; }
  if (files[n] !== undefined) {
    inp.style.borderColor = '#f59e0b';
    inp.title = 'ชื่อนี้มีอยู่แล้ว';
    inp.focus();
    return;
  }
  files[n] = '';
  try { localStorage.setItem('cn_files', JSON.stringify(files)); } catch(e) {}
  closeModals();
  openFile(n);
}

function confirmDelete() {
  if (!deleteTarget) return;
  delete files[deleteTarget];
  try { localStorage.setItem('cn_files', JSON.stringify(files)); } catch(e) {}
  closeModals();
  const keys = Object.keys(files);
  if (keys.length) {
    openFile(keys[0]);
  } else {
    currentFile = null;
    editor.innerHTML = '';
    tabName.textContent = '';
    renderFiles();
    setStatus('saved');
    updateMetrics();
  }
}

/* =============================================
   PRINT / PDF
   ============================================= */
function printPage() { doSave(); window.print(); }

let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {

if ('serviceWorker' in navigator) {
