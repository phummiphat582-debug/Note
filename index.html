<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeNote — Cyberpunk PowerShell UIL</title>
<link rel="manifest" href="/Note/manifest.json">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,300..700;1,300..700&family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Orbitron:wght@400;600;700;900&family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg-pitch-black: #000000;
  --bg-deep-card: #040508;
  --bg-cyber-panel: #07090e;
  --bg-cyber-card: #0c0f17;
  --border-neon-dim: rgba(0, 240, 255, 0.18);
  --border-neon-bright: rgba(0, 240, 255, 0.6);
  --text-main: #f8fafc;
  --text-muted: #64748b;
  --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, 'Noto Sans Thai', monospace;
  --font-hud: 'Orbitron', var(--font-mono);
  
  /* Glowing Palette */
  --glow-cyan: #00f0ff;
  --glow-pink: #ff007f;
  --glow-purple: #9d00ff;
  --glow-yellow: #ffee00;
  --glow-green: #00ff66;
}

html,body {
  height: 100%;
  width: 100%;
  background: #000000;
  color: #f8fafc;
  font-family: var(--font-mono);
  overflow: hidden;
  user-select: none;
}

/* ═══════════════════════════════════════════════════════════════
   FLOWING ANIMATED GLOWING RGB TEXT (ตัวหนังสือวิ่งเรืองแสงตลอดเวลา)
   ═══════════════════════════════════════════════════════════════ */
@keyframes continuousChromaticFlow {
  0% {
    background-position: 0% 50%;
    filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.75)) drop-shadow(0 0 16px rgba(255, 0, 127, 0.45));
  }
  25% {
    filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.8)) drop-shadow(0 0 20px rgba(157, 0, 255, 0.5));
  }
  50% {
    background-position: 200% 50%;
    filter: drop-shadow(0 0 8px rgba(157, 0, 255, 0.8)) drop-shadow(0 0 20px rgba(0, 255, 102, 0.5));
  }
  75% {
    filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.8)) drop-shadow(0 0 20px rgba(255, 238, 0, 0.5));
  }
  100% {
    background-position: 400% 50%;
    filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.75)) drop-shadow(0 0 16px rgba(255, 0, 127, 0.45));
  }
}

@keyframes neonBorderPulse {
  0%, 100% { border-color: rgba(0, 240, 255, 0.35); box-shadow: 0 0 12px rgba(0, 240, 255, 0.15) inset; }
  50% { border-color: rgba(255, 0, 127, 0.5); box-shadow: 0 0 16px rgba(255, 0, 127, 0.25) inset; }
}

@keyframes scanlineMove {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(1000%); }
}

@keyframes cursorBlinkGlow {
  0%, 49% { opacity: 1; filter: drop-shadow(0 0 8px #00f0ff); }
  50%, 100% { opacity: 0; filter: none; }
}

/* Base Flowing Text Definition */
.flowing-glow-text,
.editor,
.editor * {
  background: linear-gradient(
    90deg,
    #ff0055 0%,
    #ff7700 12%,
    #ffee00 24%,
    #00ff66 36%,
    #00f0ff 48%,
    #7000ff 60%,
    #ff00b3 72%,
    #ff0055 84%,
    #ff7700 92%,
    #00f0ff 100%
  ) !important;
  background-size: 400% 100% !important;
  -webkit-background-clip: text !important;
  -webkit-text-fill-color: transparent !important;
  animation: continuousChromaticFlow 3.6s linear infinite !important;
  display: inline;
}

.editor p, .editor div { display: block !important; }

/* Glowing Header Text */
.hud-glowing-title {
  font-family: var(--font-hud);
  font-weight: 900;
  letter-spacing: 0.15em;
  background: linear-gradient(90deg, #00f0ff, #ff007f, #ffee00, #00ff66, #00f0ff);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: continuousChromaticFlow 4s linear infinite;
  text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
}

/* ═══════════════════════════════════════════════════════════════
   CYBER UIL LAYOUT (FUTURISTIC HUD INTERFACE)
   ═══════════════════════════════════════════════════════════════ */
.cyber-app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  background: #000000;
  position: relative;
  overflow: hidden;
}

/* Background Cyber Grid */
.cyber-bg-grid {
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 1;
}

/* ── TOP HUD NAVIGATION BAR ── */
.cyber-topbar {
  height: 46px;
  background: #020305;
  border-bottom: 1px solid rgba(0, 240, 255, 0.25);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hud-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px;
  background: rgba(0, 240, 255, 0.06);
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 4px;
}
.hud-logo .logo-icon {
  color: var(--glow-cyan);
  font-size: 16px;
  filter: drop-shadow(0 0 6px var(--glow-cyan));
}
.hud-logo .logo-text {
  font-family: var(--font-hud);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #fff;
}
.hud-logo .logo-badge {
  font-size: 9px;
  background: var(--glow-pink);
  color: #fff;
  padding: 1px 4px;
  border-radius: 2px;
  font-weight: 700;
}

/* Terminal Tabs */
.cyber-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  max-width: 50vw;
}
.cyber-tabs::-webkit-scrollbar { display: none; }

.cyber-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  background: #06080d;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  font-size: 11.5px;
  color: #94a3b8;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.cyber-tab:hover {
  background: #0e121a;
  border-color: rgba(0, 240, 255, 0.4);
  color: #fff;
}
.cyber-tab.active {
  background: #0c121e;
  border-color: var(--glow-cyan);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
}
.cyber-tab .tab-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--glow-cyan);
  box-shadow: 0 0 6px var(--glow-cyan);
}
.cyber-tab .tab-close {
  font-size: 11px;
  opacity: 0.5;
  padding: 1px 4px;
  border-radius: 2px;
}
.cyber-tab .tab-close:hover {
  opacity: 1;
  background: #ff0055;
  color: #fff;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.cyber-btn {
  background: #080b12;
  color: #cbd5e1;
  border: 1px solid rgba(0, 240, 255, 0.25);
  border-radius: 4px;
  padding: 5px 10px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}
.cyber-btn:hover {
  background: #101624;
  border-color: var(--glow-cyan);
  color: #fff;
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
}
.cyber-btn.active {
  background: rgba(0, 240, 255, 0.15);
  border-color: var(--glow-cyan);
  color: var(--glow-cyan);
  box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
}

.cyber-select {
  background: #080b12;
  color: #00f0ff;
  border: 1px solid rgba(0, 240, 255, 0.3);
  border-radius: 4px;
  padding: 4px 8px;
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  outline: none;
}
.cyber-select:focus {
  border-color: var(--glow-cyan);
  box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
}

/* ── SECONDARY HUD TOOLBAR ── */
.cyber-toolbar {
  height: 38px;
  background: #010204;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  z-index: 90;
  gap: 8px;
}

.tool-cluster {
  display: flex;
  align-items: center;
  gap: 6px;
}

.cyber-badge {
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 10px;
  font-family: var(--font-hud);
  letter-spacing: 0.05em;
  font-weight: 700;
  border: 1px solid currentColor;
}
.badge-ps { color: var(--glow-cyan); background: rgba(0, 240, 255, 0.08); border-color: rgba(0, 240, 255, 0.3); }
.badge-rgb { color: var(--glow-pink); background: rgba(255, 0, 127, 0.08); border-color: rgba(255, 0, 127, 0.3); }

/* ── MAIN WORKSPACE ── */
.cyber-workspace {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
  z-index: 10;
}

/* Cyber Sidebar */
.cyber-sidebar {
  width: 230px;
  background: #020306;
  border-right: 1px solid rgba(0, 240, 255, 0.15);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.2s ease;
}
.cyber-sidebar.collapsed {
  width: 0;
  overflow: hidden;
  border-right: none;
}

.sidebar-hud-head {
  padding: 10px 12px;
  font-size: 10px;
  font-family: var(--font-hud);
  letter-spacing: 0.1em;
  color: #64748b;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-file-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
}
.sidebar-file-list::-webkit-scrollbar { width: 3px; }
.sidebar-file-list::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); }

.cyber-file-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  border-radius: 4px;
  font-size: 11.5px;
  color: #94a3b8;
  cursor: pointer;
  margin-bottom: 2px;
  border-left: 2px solid transparent;
  transition: all 0.12s;
}
.cyber-file-row:hover {
  background: rgba(0, 240, 255, 0.06);
  color: #fff;
  border-left-color: rgba(0, 240, 255, 0.4);
}
.cyber-file-row.active {
  background: rgba(0, 240, 255, 0.12);
  color: #fff;
  border-left-color: var(--glow-cyan);
  font-weight: 600;
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.15) inset;
}
.cyber-file-row .file-del {
  opacity: 0;
  color: #64748b;
  font-size: 10px;
  padding: 2px 4px;
  border-radius: 2px;
}
.cyber-file-row:hover .file-del { opacity: 1; }
.cyber-file-row .file-del:hover { background: #ff0055; color: #fff; }

/* ── CENTER POWERSHELL UIL EDITOR VIEW ── */
.cyber-viewport {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: #000000;
  position: relative;
}

/* PowerShell Prompt HUD Line */
.ps-uil-prompt-bar {
  padding: 10px 18px 4px;
  background: #010204;
  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  flex-wrap: wrap;
}
.prompt-badge-terminal {
  background: #003366;
  color: #00f0ff;
  border: 1px solid rgba(0, 240, 255, 0.4);
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 700;
  font-size: 10.5px;
}
.prompt-badge-dir {
  color: #facc15;
  font-weight: 600;
}
.prompt-arrow {
  color: var(--glow-green);
  font-weight: 900;
  font-size: 13px;
}

/* Main Note Editor with Line Numbers */
.editor-main-wrap {
  flex: 1;
  display: flex;
  overflow-y: auto;
  overflow-x: hidden;
  background: #000000;
  position: relative;
}
.editor-main-wrap::-webkit-scrollbar { width: 6px; }
.editor-main-wrap::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.25); border-radius: 3px; }

.editor-line-numbers {
  padding: 20px 10px;
  width: 52px;
  color: #334155;
  font-size: 13px;
  line-height: 1.8;
  text-align: right;
  border-right: 1px solid rgba(255, 255, 255, 0.04);
  flex-shrink: 0;
  user-select: none;
}

.editor {
  flex: 1;
  min-height: 100%;
  padding: 20px 28px;
  color: #ffffff;
  font-size: 14.5px;
  line-height: 1.8;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
  user-select: text;
  font-family: inherit;
  caret-color: #00f0ff;
  position: relative;
}
.editor:empty::before {
  content: attr(data-placeholder);
  color: #334155;
  pointer-events: none;
}

/* Image insertion */
.img-box {
  display: inline-block;
  position: relative;
  vertical-align: middle;
  margin: 6px 2px;
  border: 1px solid rgba(0, 240, 255, 0.4);
  border-radius: 6px;
  padding: 2px;
  background: #05070d;
}
.img-box img { display: block; border-radius: 4px; max-width: 100%; }
.img-box .handle {
  position: absolute;
  right: -5px;
  bottom: -5px;
  width: 12px;
  height: 12px;
  background: var(--glow-cyan);
  cursor: nwse-resize;
  border-radius: 50%;
  box-shadow: 0 0 8px var(--glow-cyan);
}
.img-box .del-img {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 16px;
  height: 16px;
  background: #ff0055;
  color: #fff;
  border-radius: 50%;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
}
.img-box:hover .del-img { opacity: 1; }

/* ── POWERSHELL INTERACTIVE CLI HUD CONSOLE ── */
.cyber-console-hud {
  background: #020305;
  border-top: 1px solid rgba(0, 240, 255, 0.2);
  padding: 8px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex-shrink: 0;
}
.console-log {
  max-height: 120px;
  overflow-y: auto;
  font-size: 11.5px;
  display: none;
  flex-direction: column;
  gap: 3px;
  padding-bottom: 4px;
}
.console-log.open { display: flex; }
.console-row { font-family: var(--font-mono); line-height: 1.4; white-space: pre-wrap; }
.console-row.success { color: var(--glow-green); text-shadow: 0 0 6px rgba(0, 255, 102, 0.4); }
.console-row.error { color: #ff0055; text-shadow: 0 0 6px rgba(255, 0, 85, 0.4); }
.console-row.info { color: var(--glow-cyan); text-shadow: 0 0 6px rgba(0, 240, 255, 0.4); }

.console-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cli-prompt-symbol {
  color: var(--glow-green);
  font-weight: 900;
  font-size: 13px;
  font-family: var(--font-hud);
}
.cli-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-family: var(--font-mono);
  font-size: 13px;
  outline: none;
}
.cli-input::placeholder { color: #334155; }

/* ── BOTTOM STATUS BAR ── */
.cyber-statusbar {
  height: 24px;
  background: #000000;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 16px;
  font-size: 10.5px;
  color: #64748b;
  flex-shrink: 0;
  z-index: 100;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}
.status-pill.active-rgb {
  color: #00f0ff;
  text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
  font-weight: 600;
}
.status-pill.save-ok {
  color: var(--glow-green);
}

/* ── SFX PANEL POPUP ── */
.sfx-popup {
  display: none;
  position: absolute;
  top: 86px;
  right: 14px;
  width: 310px;
  background: #04060a;
  border: 1px solid var(--border-neon-bright);
  border-radius: 6px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 15px rgba(0,240,255,0.2);
  z-index: 99999;
}
.sfx-popup.open { display: block; }
.sfx-head {
  padding: 10px 14px;
  font-family: var(--font-hud);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  color: #64748b;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sfx-list { padding: 6px 0; max-height: 260px; overflow-y: auto; }
.sfx-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  cursor: pointer;
  transition: all 0.1s;
  border-left: 2px solid transparent;
}
.sfx-item:hover { background: rgba(0, 240, 255, 0.08); }
.sfx-item.active {
  background: rgba(0, 240, 255, 0.14);
  border-left-color: var(--glow-cyan);
}
.sfx-item-name { font-size: 12px; color: #fff; font-weight: 600; }
.sfx-item-desc { font-size: 10px; color: #64748b; }

/* Modal Dialogs */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.cyber-modal {
  background: #05070d;
  border: 1px solid var(--glow-cyan);
  box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
  border-radius: 6px;
  width: 380px;
}
.cyber-modal-head {
  padding: 12px 16px;
  font-family: var(--font-hud);
  font-size: 12px;
  color: #fff;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  align-items: center;
  gap: 8px;
}
.cyber-modal-body { padding: 16px; }
.cyber-modal-body input {
  width: 100%;
  padding: 8px 12px;
  background: #000;
  color: #00f0ff;
  border: 1px solid rgba(0, 240, 255, 0.4);
  border-radius: 4px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.cyber-modal-body input:focus {
  border-color: var(--glow-cyan);
  box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
}
.cyber-modal-foot {
  padding: 10px 16px 14px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

#particleCanvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 99999;
}

@media print {
  .cyber-topbar, .cyber-toolbar, .cyber-sidebar, .cyber-console-hud, .cyber-statusbar, .editor-line-numbers, .ps-uil-prompt-bar {
    display: none !important;
  }
  .cyber-app, .cyber-viewport { background: #fff !important; color: #000 !important; }
  .editor, .editor * { background: none !important; -webkit-text-fill-color: #000 !important; color: #000 !important; font-size: 12pt !important; }
}
</style>
</head>

<body>
<canvas id="particleCanvas"></canvas>

<div class="cyber-app">
  <div class="cyber-bg-grid"></div>

  <!-- ── TOP HUD BAR ── -->
  <div class="cyber-topbar">
    <div class="topbar-left">
      <div class="hud-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">CODENOTE</span>
        <span class="logo-badge">UIL</span>
      </div>

      <!-- Windows Terminal Tab Bar -->
      <div class="cyber-tabs" id="terminalTabs"></div>
      <button class="cyber-btn" onclick="openCreate()" title="New Tab / Note (Ctrl+N)">+ Tab</button>
    </div>

    <div class="topbar-right">
      <button class="cyber-btn" onclick="toggleSidebar()" title="Toggle Sidebar Tree">📁 Tree</button>
      <button class="cyber-btn" onclick="printPage()" title="Print / PDF">🖨️ PDF</button>

      <!-- Keyboard Sound Switch -->
      <button class="cyber-btn" id="sfxBtn" onclick="toggleSfxPanel(event)" title="Mechanical Sound Settings">

<script>
/* ═══════════════════════════════════════════════════════════════
   NEON PARTICLES & GLOW SPARKS
   ═══════════════════════════════════════════════════════════════ */
const particleCanvas = document.getElementById('particleCanvas');
const pctx = particleCanvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  particleCanvas.width = window.innerWidth;
  particleCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function addSpark(x, y) {
  const colors = ['#00f0ff', '#ff007f', '#ffee00', '#00ff66', '#9d00ff'];
  for (let i = 0; i < 7; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5 - 1.5,
      size: Math.random() * 3.5 + 1.5,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      decay: Math.random() * 0.04 + 0.02
    });
  }
}

function renderParticles() {
  pctx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;
    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }
    pctx.save();
    pctx.globalAlpha = p.alpha;
    pctx.fillStyle = p.color;
    pctx.shadowColor = p.color;
    pctx.shadowBlur = 10;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    pctx.fill();
    pctx.restore();
  }
  requestAnimationFrame(renderParticles);
}
renderParticles();

/* ═══════════════════════════════════════════════════════════════
   MULTI-PROFILE KEYBOARD AUDIO ENGINE
   ═══════════════════════════════════════════════════════════════ */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null, masterGain = null, masterVol = 0.85;

function getACtx() {
  if (!actx) {
    actx = new AudioCtx();
    masterGain = actx.createGain();
    masterGain.gain.value = masterVol;
    masterGain.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

const SFX_PROFILES = [
  {
    id: 'galaxy', name: 'Dekey Galaxy 100 V2', desc: 'Gasket · Linear · Deep Thock',
    icon: '🌌', badge: 'THOCK', badgeColor: '#00ff66',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      sine(ctx, dest, t, isSpecial ? 58 : (72 + rnd(18)), 0.55 * pitch, 0.003, 0.058, 0.52 * vel, 0.55);
      noise(ctx, dest, t, 0.035, isSpecial ? 140 : 170, isSpecial ? 320 : (380 + rnd(80)), 0.9, 0.002, 0.036, 0.38 * vel);
      tri(ctx, dest, t, isSpecial ? 210 : (260 + rnd(60)), 0.75 * pitch, 0.004, 0.048, 0.18 * vel, pitch);
      sine(ctx, dest, t, 2500, 1200, 0.001, 0.020, 0.045 * vel, 1, true);
      if (isSpecial) stabRattle(ctx, dest, t, 280, 0.12 * vel);
    }
  },
  {
    id: 'holy_panda', name: 'Holy Pandas', desc: 'Tactile bump · Round thock',
    icon: '🐼', badge: 'TACTILE', badgeColor: '#00f0ff',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      sine(ctx, dest, t, isSpecial ? 80 : (95 + rnd(15)), 0.6 * pitch, 0.002, 0.07, 0.48 * vel, 0.5);
      sine(ctx, dest, t, 1800, 900, 0.0005, 0.012, 0.12 * vel, 1, true);
      noise(ctx, dest, t, 0.030, 200, 450, 1.2, 0.002, 0.030, 0.42 * vel);
      tri(ctx, dest, t, isSpecial ? 180 : (220 + rnd(40)), 0.8 * pitch, 0.005, 0.055, 0.22 * vel, pitch);
      if (isSpecial) stabRattle(ctx, dest, t, 260, 0.10 * vel);
    }
  },
  {
    id: 'topre', name: 'HHKB Topre 45g', desc: 'Electrostatic · Soft Dome',
    icon: '⌨️', badge: 'TOPRE', badgeColor: '#9d00ff',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      sine(ctx, dest, t, isSpecial ? 65 : (78 + rnd(10)), 0.5 * pitch, 0.001, 0.10, 0.44 * vel, 0.45);
      noise(ctx, dest, t, 0.018, 300, 600, 2.0, 0.001, 0.018, 0.22 * vel);
      sine(ctx, dest, t, 3200, 1400, 0.0005, 0.015, 0.06 * vel, 1, true);
      tri(ctx, dest, t, isSpecial ? 170 : (200 + rnd(30)), 0.7 * pitch, 0.004, 0.065, 0.20 * vel, pitch);
    }
  },
  {
    id: 'mx_blue', name: 'Cherry MX Blue', desc: 'Click bar · Sharp clack',
    icon: '🔵', badge: 'CLICKY', badgeColor: '#00f0ff',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      sine(ctx, dest, t, 4200, 2200, 0.0003, 0.010, 0.55 * vel, 1, true);
      sine(ctx, dest, t, isSpecial ? 100 : (110 + rnd(20)), 0.55 * pitch, 0.002, 0.045, 0.35 * vel, 0.5);
      noise(ctx, dest, t, 0.020, 400, 3000, 0.6, 0.001, 0.020, 0.40 * vel);
      tri(ctx, dest, t, isSpecial ? 240 : (280 + rnd(50)), 0.8 * pitch, 0.003, 0.035, 0.15 * vel, pitch);
      if (isSpecial) stabRattle(ctx, dest, t, 200, 0.18 * vel);
    }
  },
  {
    id: 'ibm_model_m', name: 'IBM Model M', desc: 'Buckling spring vintage legend',
    icon: '🏛️', badge: 'BUCKLING', badgeColor: '#ffee00',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      sine(ctx, dest, t, 5500, 2800, 0.0003, 0.008, 0.65 * vel, 1, true);
      sine(ctx, dest, t, isSpecial ? 85 : (100 + rnd(20)), 0.5 * pitch, 0.001, 0.050, 0.50 * vel, 0.5);
      noise(ctx, dest, t, 0.025, 300, 4000, 0.5, 0.001, 0.025, 0.55 * vel);
      tri(ctx, dest, t, isSpecial ? 280 : (320 + rnd(60)), 0.75 * pitch, 0.002, 0.038, 0.28 * vel, pitch);
      if (isSpecial) stabRattle(ctx, dest, t, 220, 0.22 * vel);
    }
  }
];

function rnd(n){ return Math.random() * n; }
function sine(ctx, dest, t, freqStart, freqEnd, attack, decay, vol, pitchMod, hiFreq=false){
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freqStart * pitchMod, t);
  if(freqEnd !== freqStart) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd * pitchMod), t + (hiFreq ? decay : decay * 0.6));
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + decay + 0.01);
}
function tri(ctx, dest, t, freq, freqRatio, attack, decay, vol, pitchMod){
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq * pitchMod, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * pitchMod * freqRatio), t + decay);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + decay + 0.01);
}
function noise(ctx, dest, t, dur, hpFreq, lpFreq, lpQ, attack, decay, vol){
  const bufLen = Math.floor(ctx.sampleRate * dur), buf = ctx.createBuffer(1, bufLen, ctx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<bufLen;i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = hpFreq;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = lpFreq; lp.Q.value = lpQ;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(dest);
  src.start(t); src.stop(t + dur + 0.01);
}
function stabRattle(ctx, dest, t, lpFreq, vol){
  const bufS = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.028), ctx.sampleRate), dS = bufS.getChannelData(0);
  for(let i=0;i<dS.length;i++) dS[i] = (Math.random() * 2 - 1) * 0.6;
  const ns = ctx.createBufferSource(); ns.buffer = bufS;
  const lpf = ctx.createBiquadFilter(); lpf.type = 'lowpass'; lpf.frequency.value = lpFreq;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t + 0.004);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.032);
  ns.connect(lpf); lpf.connect(g); g.connect(dest);
  ns.start(t + 0.004); ns.stop(t + 0.036);
}

let soundOn = localStorage.getItem('cn_sfx') !== 'off';
let activeProfileId = localStorage.getItem('cn_sfx_profile') || 'galaxy';

function playKey(isSpecial) {
  if (!soundOn) return;
  try {
    const ctx = getACtx();
    const vel = 0.78 + Math.random() * 0.22;
    const pitch = 1 + (Math.random() - 0.5) * 0.08;
    const prof = SFX_PROFILES.find(p => p.id === activeProfileId) || SFX_PROFILES[0];
    prof.play(ctx, masterGain, isSpecial, vel, pitch);
  } catch(err) {}
}

function buildSfxPanel() {
  const container = document.getElementById('sfxProfiles');
  if(!container) return;
  container.innerHTML = '';
  SFX_PROFILES.forEach(p => {
    const el = document.createElement('div');
    el.className = 'sfx-item' + (p.id === activeProfileId ? ' active' : '');
    el.innerHTML = `
      <div style="font-size:16px;">${p.icon}</div>
      <div style="flex:1;">
        <div class="sfx-item-name">${p.name}</div>
        <div class="sfx-item-desc">${p.desc}</div>
      </div>
      <span class="cyber-badge" style="color:${p.badgeColor};border-color:${p.badgeColor}">${p.badge}</span>
    `;
    el.onclick = () => selectProfile(p.id, true);
    container.appendChild(el);
  });
  updateSfxUI();
}

function selectProfile(id, preview=false) {
  activeProfileId = id;
  localStorage.setItem('cn_sfx_profile', id);
  buildSfxPanel();
  if (preview && soundOn) {
    [0, 70, 140].forEach(d => setTimeout(() => playKey(false), d));
  }
}

function onSfxToggle(checked) {
  soundOn = checked;
  localStorage.setItem('cn_sfx', checked ? 'on' : 'off');
  updateSfxUI();
  if (checked) { getACtx(); playKey(false); }
}

function onVolChange(val) {
  masterVol = val / 100;
  document.getElementById('sfxVolVal').textContent = val + '%';
  if (masterGain) masterGain.gain.value = masterVol;
}

function updateSfxUI() {
  const prof = SFX_PROFILES.find(p => p.id === activeProfileId) || SFX_PROFILES[0];
  const tog = document.getElementById('sfxToggle');
  const dot = document.getElementById('sfxDot');
  const lbl = document.getElementById('sfxLabel');
  const statusEl = document.getElementById('sfxStatus');

  if (tog) tog.checked = soundOn;
  if (dot) {
    dot.style.background = soundOn ? prof.badgeColor : '#475569';
    dot.style.boxShadow = soundOn ? `0 0 8px ${prof.badgeColor}` : 'none';
  }
  if (lbl) lbl.textContent = soundOn ? prof.icon + ' ' + prof.badge : 'SFX OFF';
  if (statusEl) {
    statusEl.textContent = soundOn ? `♪ ${prof.name}` : '♪ Muted';
    statusEl.style.color = soundOn ? prof.badgeColor : '#64748b';
  }
}

let sfxPanelOpen = false;
function toggleSfxPanel(e) {
  e.stopPropagation();
  sfxPanelOpen = !sfxPanelOpen;
  document.getElementById('sfxPanel').classList.toggle('open', sfxPanelOpen);
}
document.addEventListener('click', e => {
  if (sfxPanelOpen && !document.getElementById('sfxPanel').contains(e.target) && e.target.id !== 'sfxBtn') {
    sfxPanelOpen = false;
    document.getElementById('sfxPanel').classList.remove('open');
  }
});

/* ═══════════════════════════════════════════════════════════════
   RGB SPEED DURATION CHANGER
   ═══════════════════════════════════════════════════════════════ */
function setRgbSpeed(speed) {
  const styleEl = document.getElementById('dynamicRgbSpeedStyle') || document.createElement('style');
  styleEl.id = 'dynamicRgbSpeedStyle';
  styleEl.innerHTML = `.flowing-glow-text, .editor, .editor * { animation-duration: ${speed} !important; }`;
  document.head.appendChild(styleEl);
}

/* ═══════════════════════════════════════════════════════════════
   FILE SYSTEM & TABS
   ═══════════════════════════════════════════════════════════════ */
let files = {};
try { files = JSON.parse(localStorage.getItem('cn_files') || '{}'); } catch(e) { files = {}; }
let currentFile = null;
let deleteTarget = null;
let saveTimer = null;
let isDirty = false;

const editor = document.getElementById('editor');
const fileList = document.getElementById('fileList');
const terminalTabs = document.getElementById('terminalTabs');
const saveStatus = document.getElementById('saveStatus');
const imageInput = document.getElementById('imageInput');

function scheduleSave() {
  isDirty = true;
  setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 600);
}

function doSave() {
  if (!currentFile || !isDirty) return;
  files[currentFile] = editor.innerHTML;
  try { localStorage.setItem('cn_files', JSON.stringify(files)); } catch(e) { setStatus('error'); return; }
  isDirty = false;
  setStatus('saved');
}

function setStatus(s) {
  if (s === 'saving') { saveStatus.textContent = '● Saving...'; saveStatus.style.color = '#ffee00'; }
  else if (s === 'error') { saveStatus.textContent = '● Save failed'; saveStatus.style.color = '#ff0055'; }
  else { saveStatus.textContent = '● Saved'; saveStatus.style.color = '#00ff66'; }
}

function updateLineNumbers() {
  const text = editor.innerText || '';
  const lines = text.split('\n').length || 1;
  const nums = Array.from({length: lines}, (_, i) => i + 1).join('\n');
  document.getElementById('lineNumbers').textContent = nums;
}

function updateMetrics() {
  const text = editor.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = words.toLocaleString() + ' words';
  document.getElementById('charCount').textContent = text.length.toLocaleString() + ' chars';
  updateLineNumbers();
}

function renderTabsAndFiles() {
  const names = Object.keys(files);
  document.getElementById('fileCountBadge').textContent = `${names.length} files`;

  // Render Tabs
  terminalTabs.innerHTML = '';
  names.forEach(n => {
    const tab = document.createElement('div');
    tab.className = 'cyber-tab' + (n === currentFile ? ' active' : '');
    tab.innerHTML = `
      <span class="tab-dot"></span>
      <span title="${n}">${n}</span>
      <span class="tab-close" onclick="event.stopPropagation(); askDelete('${n.replace(/'/g, "\\'")}')" title="Close">✕</span>
    `;
    tab.onclick = () => openFile(n);
    terminalTabs.appendChild(tab);
  });

  // Render Sidebar
  fileList.innerHTML = '';
  names.forEach(n => {
    const row = document.createElement('div');
    row.className = 'cyber-file-row' + (n === currentFile ? ' active' : '');
    row.innerHTML = `
      <div style="display:flex;align-items:center;gap:7px;min-width:0;flex:1;" onclick="openFile('${n.replace(/'/g, "\\'")}')">
        <span style="color:var(--glow-cyan);">📄</span>
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${n}">${n}</span>
      </div>
      <span class="file-del" onclick="askDelete('${n.replace(/'/g, "\\'")}')" title="ลบ">✕</span>
    `;
    fileList.appendChild(row);
  });
}

function openFile(n) {
  if (n === currentFile && editor.innerHTML) return;
  doSave();
  currentFile = n;
  editor.innerHTML = files[n] || '';
  document.getElementById('currentFileBadge').textContent = n;
  isDirty = false;
  setStatus('saved');
  renderTabsAndFiles();
  attachResizeAll();
  updateMetrics();
  editor.focus();
}

/* ═══════════════════════════════════════════════════════════════
   KEYSTROKES & TYPING SPARK PARTICLES
   ═══════════════════════════════════════════════════════════════ */
editor.addEventListener('keydown', e => {
  const special = e.key === 'Enter' || e.key === 'Backspace' || e.key === 'Delete' || e.key === ' ';
  playKey(special);

  // Rainbow Spark Particle at Cursor
  try {
    const sel = window.getSelection();
    if (sel && sel.rangeCount) {
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      if (rect.x > 0 && rect.y > 0) addSpark(rect.x, rect.y + 10);
    }
  } catch(err) {}

  if (e.key === 'Tab') {
    e.preventDefault();
    document.execCommand('insertText', false, '    ');
  }
});

editor.addEventListener('input', () => {
  scheduleSave();
  updateMetrics();
});

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key === 's') { e.preventDefault(); doSave(); logCmd('File saved: ' + currentFile, 'success'); }
  if (mod && e.key === 'n') { e.preventDefault(); openCreate(); }
  if (e.key === 'Escape') { closeModals(); sfxPanelOpen = false; document.getElementById('sfxPanel').classList.remove('open'); }
  if (e.key === 'Enter' && document.getElementById('createModal').classList.contains('show')) { e.preventDefault(); confirmCreate(); }
});

document.addEventListener('selectionchange', () => {
  try {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    const r = sel.getRangeAt(0).cloneRange();
    r.selectNodeContents(editor);
    r.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
    const lines = r.toString().split('\n');
    const ln = lines.length;
    const col = lines[lines.length - 1].length + 1;
    document.getElementById('cursorPos').textContent = `Ln ${ln}, Col ${col}`;
  } catch(e) {}
});

/* ═══════════════════════════════════════════════════════════════
   INTERACTIVE POWERSHELL COMMAND CONSOLE
   ═══════════════════════════════════════════════════════════════ */
const cmdInput = document.getElementById('cmdInput');
const cmdLog = document.getElementById('cmdLog');
let cmdHistory = [], historyIndex = -1;

function logCmd(msg, type = 'info') {
  cmdLog.classList.add('open');
  const row = document.createElement('div');
  row.className = `console-row ${type}`;
  row.textContent = msg;
  cmdLog.appendChild(row);
  cmdLog.scrollTop = cmdLog.scrollHeight;
}

function runCommandFromInput() {
  const val = cmdInput.value.trim();
  if (!val) return;
  cmdHistory.push(val);
  historyIndex = cmdHistory.length;
  cmdInput.value = '';
  executePowerShellCmd(val);
}

cmdInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    runCommandFromInput();
  } else if (e.key === 'ArrowUp') {
    if (historyIndex > 0) {
      historyIndex--;
      cmdInput.value = cmdHistory[historyIndex] || '';
    }
  } else if (e.key === 'ArrowDown') {
    if (historyIndex < cmdHistory.length - 1) {
      historyIndex++;
      cmdInput.value = cmdHistory[historyIndex] || '';
    } else {
      historyIndex = cmdHistory.length;
      cmdInput.value = '';
    }
  }
});

function executePowerShellCmd(input) {
  logCmd(`PS C:\\Users\\CodeNote> ${input}`, 'info');
  const parts = input.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');

  switch(cmd) {
    case 'ls':
    case 'dir':
    case 'gci':
      logCmd(`    Directory: C:\\Users\\CodeNote\nMode                LastWriteTime         Length Name\n----                -------------         ------ ----`, 'info');
      Object.keys(files).forEach(name => {
        const len = (files[name] || '').length;
        logCmd(`-a----         8/22/2026   5:00 PM         ${len.toString().padStart(6, ' ')} ${name}`, 'info');
      });
      break;

    case 'cat':
    case 'type':
    case 'gc':
      if (!arg) { logCmd('Usage: cat <filename>', 'error'); break; }
      if (files[arg] !== undefined) {
        const temp = document.createElement('div');
        temp.innerHTML = files[arg];
        logCmd(temp.innerText || '(empty file)', 'info');
      } else {
        logCmd(`Cannot find path '${arg}' because it does not exist.`, 'error');
      }
      break;

    case 'new':
    case 'ni':
    case 'touch':
      if (!arg) { openCreate(); break; }
      if (files[arg] !== undefined) { logCmd(`File '${arg}' already exists.`, 'error'); }
      else {
        files[arg] = '';
        localStorage.setItem('cn_files', JSON.stringify(files));
        openFile(arg);
        logCmd(`Created new note file: ${arg}`, 'success');
      }
      break;

    case 'edit':
    case 'code':
    case 'notepad':
    case 'open':
      if (!arg) { logCmd('Usage: edit <filename>', 'error'); break; }
      if (files[arg] !== undefined) {
        openFile(arg);
        logCmd(`Opened '${arg}' in editor.`, 'success');
      } else {
        logCmd(`File '${arg}' not found. Creating new file...`, 'info');
        files[arg] = '';
        localStorage.setItem('cn_files', JSON.stringify(files));
        openFile(arg);
      }
      break;

    case 'rm':
    case 'del':
    case 'remove-item':
      if (!arg) { logCmd('Usage: rm <filename>', 'error'); break; }
      if (files[arg] !== undefined) {
        deleteTarget = arg;
        confirmDelete();
        logCmd(`Removed note file: ${arg}`, 'success');
      } else {
        logCmd(`Cannot find file '${arg}'.`, 'error');
      }
      break;

    case 'clear':
    case 'cls':
      cmdLog.innerHTML = '';
      cmdLog.classList.remove('open');
      break;

    case 'sfx':
      if (!arg) {
        logCmd(`Available Sound Profiles:\n` + SFX_PROFILES.map(p => `  • ${p.id} (${p.name})`).join('\n'), 'info');
      } else {
        const target = SFX_PROFILES.find(p => p.id === arg || p.name.toLowerCase().includes(arg.toLowerCase()));
        if (target) {
          selectProfile(target.id, true);
          logCmd(`Switched SFX profile to: ${target.name}`, 'success');
        } else {
          logCmd(`SFX profile '${arg}' not found.`, 'error');
        }
      }
      break;

    case 'help':
    case 'get-help':
    case '?':
      logCmd(`PowerShell CodeNote UIL Commands:
  • dir, ls              - แสดงรายชื่อโน้ตทั้งหมด
  • cat <name>           - อ่านเนื้อหาของไฟล์
  • new <name>           - สร้างไฟล์โน้ตใหม่
  • edit <name>          - เปิดไฟล์ในตัวแก้ไข
  • rm <name>            - ลบไฟล์
  • sfx [profile]        - เปลี่ยนเสียงคีย์บอร์ด (galaxy, holy_panda, topre, mx_blue, ibm_model_m)
  • cls, clear           - ล้างข้อความ Terminal`, 'info');
      break;

    default:
      logCmd(`The term '${cmd}' is not recognized as a cmdlet. Type 'help' for command list.`, 'error');
      break;
  }
}

/* ═══════════════════════════════════════════════════════════════
   UI ACTIONS & TOOLBAR
   ═══════════════════════════════════════════════════════════════ */
function cmd(c) { editor.focus(); document.execCommand(c, false, null); }

function toggleSidebar() {
  const sb = document.getElementById('psSidebar');
  sb.classList.toggle('collapsed');
}

function addImage() { editor.focus(); imageInput.value = ''; imageInput.click(); }
imageInput.onchange = e => Array.from(e.target.files).forEach(insertImageFile);

function insertImageFile(file) {
  const r = new FileReader();
  r.onload = () => insertImageSrc(r.result, '260px');
  r.readAsDataURL(file);
}

function insertImageSrc(src, width = '260px') {
  const box = buildImgBox(src, width);
  const sel = window.getSelection();
  if (sel && sel.rangeCount) {
    const range = sel.getRangeAt(0);
    range.collapse(false);
    range.insertNode(box);
  } else {
    editor.appendChild(box);
  }
  enableResize(box.querySelector('img'), box.querySelector('.handle'));
  scheduleSave();
}

function buildImgBox(src, width) {
  const box = document.createElement('span');
  box.className = 'img-box';
  box.contentEditable = 'false';
  const img = document.createElement('img');
  img.src = src;
  img.style.width = width;
  const handle = document.createElement('span');
  handle.className = 'handle';
  handle.title = 'Drag to resize';
  const del = document.createElement('span');
  del.className = 'del-img';
  del.textContent = '✕';
  del.onclick = () => { box.remove(); scheduleSave(); };
  box.appendChild(img);
  box.appendChild(handle);
  box.appendChild(del);
  return box;
}

function enableResize(img, handle) {
  handle.onmousedown = e => {
    e.preventDefault();
    const startX = e.clientX, startW = img.offsetWidth;
    const onMove = ev => img.style.width = Math.max(50, startW + (ev.clientX - startX)) + 'px';
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      scheduleSave();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
}

function attachResizeAll() {
  document.querySelectorAll('.img-box').forEach(b => enableResize(b.querySelector('img'), b.querySelector('.handle')));
}

/* Modals */
function openCreate() {
  document.getElementById('createModal').classList.add('show');
  setTimeout(() => {
    const i = document.getElementById('nameInput');
    i.value = '';
    i.focus();
  }, 60);
}

function askDelete(n) {
  deleteTarget = n;
  document.getElementById('deleteText').innerHTML = `ต้องการลบไฟล์ <strong style="color:var(--glow-cyan)">"${n}"</strong> หรือไม่?<br><span style="color:#64748b;font-size:11.5px;">ไฟล์นี้จะถูกลบออกจากระบบทันที</span>`;
  document.getElementById('deleteModal').classList.add('show');
}

function closeModals() {
  document.getElementById('createModal').classList.remove('show');
  document.getElementById('deleteModal').classList.remove('show');
}

function confirmCreate() {
  const inp = document.getElementById('nameInput');
  let n = inp.value.trim();
  if (!n) { inp.style.borderColor = '#ff0055'; inp.focus(); return; }
  if (!n.includes('.')) n += '.ps1';
  if (files[n] !== undefined) { inp.style.borderColor = '#ffee00'; inp.focus(); return; }
  files[n] = '';
  try { localStorage.setItem('cn_files', JSON.stringify(files)); } catch(e) {}
  closeModals();
  openFile(n);
  logCmd(`Created and opened new note: ${n}`, 'success');
}

function confirmDelete() {
  if (!deleteTarget) return;
  delete files[deleteTarget];
  try { localStorage.setItem('cn_files', JSON.stringify(files)); } catch(e) {}
  closeModals();
  const keys = Object.keys(files);
  if (keys.length) openFile(keys[0]);
  else {
    currentFile = null;
    editor.innerHTML = '';
    document.getElementById('currentFileBadge').textContent = '(no file)';
    renderTabsAndFiles();
    setStatus('saved');
    updateMetrics();
  }
}

function printPage() { doSave(); window.print(); }

/* ── Drag & Drop Images ── */
const editorContainer = document.getElementById('editorContainer');
editorContainer.addEventListener('dragover', e => e.preventDefault());
editorContainer.addEventListener('drop', e => {
  e.preventDefault();
  const imgs = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  imgs.forEach(insertImageFile);
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/Note/sw.js').catch(()=>{}));
}
