<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeNote</title>
<link rel="manifest" href="/Note/manifest.json">
<meta name="theme-color" content="#0e639c">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1a1a1b;font-family:Consolas,'SF Mono',monospace;overflow:hidden}
.app{display:flex;height:100vh}

/* sidebar */
.sidebar{width:220px;background:#202021;color:#ccc;display:flex;flex-direction:column;border-right:1px solid #333;flex-shrink:0}
.sidebar-top{padding:10px 12px 6px;display:flex;align-items:center;justify-content:space-between}
.sidebar-top span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#666}
.file-list{flex:1;overflow-y:auto;overflow-x:hidden}
.file-list::-webkit-scrollbar{width:4px}
.file-list::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
.file-item{display:flex;align-items:center;padding:7px 10px;cursor:pointer;gap:6px;transition:background .12s;border-left:2px solid transparent}
.file-item:hover{background:#2a2a2b}
.file-item.active{background:#2e2e30;border-left-color:#0e639c;color:#fff}
.file-item .name{flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-item .del{opacity:0;color:#666;font-size:11px;padding:2px 4px;border-radius:3px;transition:opacity .15s;cursor:pointer;flex-shrink:0}
.file-item:hover .del{opacity:1}
.file-item .del:hover{color:#ef4444;background:#2f1515}
.new-btn{margin:8px;padding:7px 10px;background:#0e639c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;transition:background .15s;text-align:left;display:flex;align-items:center;gap:6px}
.new-btn:hover{background:#1177b0}
.new-btn:active{transform:scale(.98)}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* topbar */
.topbar{height:40px;background:#202021;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #2e2e30;flex-shrink:0;gap:8px}
.tab-name{font-size:12.5px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.toolbar{display:flex;align-items:center;gap:4px;flex-shrink:0}
.tb-btn{background:transparent;color:#aaa;border:none;padding:4px 7px;border-radius:4px;cursor:pointer;font-size:12px;transition:background .12s,color .12s;white-space:nowrap}
.tb-btn:hover{background:#2e2e30;color:#fff}
.tb-btn:active{transform:scale(.96)}
.tb-sep{width:1px;height:16px;background:#333;margin:0 2px}
.tb-select{background:#2e2e30;color:#ccc;border:1px solid #3a3a3c;padding:3px 5px;border-radius:4px;font-size:11.5px;cursor:pointer;font-family:inherit}
.tb-select:focus{outline:none;border-color:#0e639c}
.tb-color{width:26px;height:22px;border:1px solid #3a3a3c;border-radius:4px;cursor:pointer;padding:1px;background:#2e2e30}

/* statusbar */
.statusbar{height:22px;background:#0e639c;display:flex;align-items:center;padding:0 12px;gap:16px;flex-shrink:0}
.status-item{font-size:11px;color:rgba(255,255,255,.75);white-space:nowrap}
.status-item.save-ok{color:#7ee787}
.status-item.saving{color:#fbbf24}

/* editor area */
.editor-wrap{flex:1;overflow:auto;position:relative}
.editor-wrap::-webkit-scrollbar{width:8px}
.editor-wrap::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
.editor-wrap::-webkit-scrollbar-thumb:hover{background:#444}
.editor{min-height:100%;padding:28px 36px;color:#d4d4d4;font-size:14px;outline:none;white-space:pre-wrap;line-height:1.8;caret-color:#0e639c;word-break:break-word}
.editor:empty::before{content:attr(data-placeholder);color:#444;pointer-events:none}
.editor-wrap.dragover{outline:2px dashed #0e639c;outline-offset:-4px}

/* image */
.img-box{display:inline-block;position:relative;vertical-align:middle;margin:2px}
.img-box img{display:block;border-radius:4px}
.img-box .handle{position:absolute;right:-5px;bottom:-5px;width:11px;height:11px;background:#0e639c;cursor:nwse-resize;border-radius:50%;opacity:.8}
.img-box .handle:hover{opacity:1}
.img-box .del-img{position:absolute;top:-6px;right:-6px;width:14px;height:14px;background:#ef4444;color:#fff;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity .15s;line-height:1}
.img-box:hover .del-img{opacity:1}

/* ── SOUND PICKER PANEL ─────────────────── */
.sfx-wrap{position:relative;display:inline-flex;align-items:center}

.sfx-btn{
  display:flex;align-items:center;gap:5px;
  background:transparent;color:#aaa;border:none;
  padding:4px 8px;border-radius:4px;cursor:pointer;
  font-size:12px;font-family:inherit;
  transition:background .12s,color .12s;
  white-space:nowrap;
}
.sfx-btn:hover{background:#2e2e30;color:#fff}
.sfx-btn.on{color:#7ee787}
.sfx-btn.on .sfx-dot{background:#7ee787;box-shadow:0 0 5px #7ee78799}

.sfx-dot{
  width:6px;height:6px;border-radius:50%;
  background:#555;flex-shrink:0;
  transition:background .2s,box-shadow .2s;
}

/* dropdown panel */
.sfx-panel{
  display:none;position:absolute;top:calc(100% + 6px);right:0;
  width:300px;
  background:#1c1c1e;border:1px solid #3a3a3c;border-radius:10px;
  box-shadow:0 8px 32px #0008;
  z-index:9000;overflow:hidden;
  animation:sfxPop .14s ease;
}
.sfx-panel.open{display:block}
@keyframes sfxPop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.sfx-panel-head{
  padding:10px 14px 8px;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:#555;border-bottom:1px solid #2a2a2c;
  display:flex;align-items:center;justify-content:space-between;
}
.sfx-panel-head span{color:#888}

/* profile list */
.sfx-profiles{padding:6px 0}

.sfx-profile{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;cursor:pointer;
  transition:background .1s;
  border-left:2px solid transparent;
}
.sfx-profile:hover{background:#252528}
.sfx-profile.active{
  background:#1e2a1e;
  border-left-color:var(--pfx-color, #7ee787);
}

.sfx-profile-icon{
  width:28px;height:28px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.sfx-profile-info{flex:1;min-width:0}
.sfx-profile-name{font-size:12px;color:#ddd;font-weight:600;font-family:inherit}
.sfx-profile-desc{font-size:10px;color:#555;margin-top:1px;font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfx-profile-badge{
  font-size:9px;padding:1px 6px;border-radius:100px;
  font-family:inherit;letter-spacing:.05em;flex-shrink:0;
  border:1px solid currentColor;opacity:.7;
}

/* volume row */
.sfx-footer{
  border-top:1px solid #2a2a2c;padding:8px 14px 10px;
  display:flex;align-items:center;gap:8px;
}
.sfx-footer label{font-size:10px;color:#555;white-space:nowrap}
.sfx-footer input[type=range]{
  flex:1;height:3px;
  -webkit-appearance:none;background:#333;border-radius:2px;outline:none;cursor:pointer;
}
.sfx-footer input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:#0e639c;cursor:pointer;
}
.sfx-vol-val{font-size:10px;color:#888;min-width:28px;text-align:right;font-family:inherit}

/* toggle row */
.sfx-toggle-row{
  padding:6px 14px 8px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid #2a2a2c;
}
.sfx-toggle-label{font-size:11px;color:#aaa}
.sfx-switch{
  position:relative;width:34px;height:18px;cursor:pointer;
}
.sfx-switch input{opacity:0;width:0;height:0;position:absolute}
.sfx-slider-track{
  position:absolute;inset:0;background:#333;border-radius:9px;
  transition:background .2s;
}
.sfx-switch input:checked + .sfx-slider-track{background:#0e639c}
.sfx-slider-thumb{
  position:absolute;top:2px;left:2px;
  width:14px;height:14px;border-radius:50%;
  background:#888;transition:transform .2s,background .2s;
}
.sfx-switch input:checked ~ .sfx-slider-thumb{
  transform:translateX(16px);background:#fff;
}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(2px)}
.overlay.show{display:flex}
.modal{background:#252526;border:1px solid #3a3a3c;border-radius:10px;width:360px;animation:popIn .15s ease}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{padding:14px 16px 10px;font-size:13px;font-weight:600;color:#e5e5e5;border-bottom:1px solid #333}
.modal-body{padding:14px 16px}
.modal-body input{width:100%;padding:9px 11px;background:#1e1e1f;color:#e5e5e5;border:1px solid #3a3a3c;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
.modal-body input:focus{border-color:#0e639c}
.modal-foot{padding:10px 16px 14px;display:flex;justify-content:flex-end;gap:8px}
.mbtn{padding:6px 14px;border:none;cursor:pointer;border-radius:6px;font-size:12px;transition:opacity .12s,transform .1s;font-family:inherit}
.mbtn:hover{opacity:.85}
.mbtn:active{transform:scale(.97)}
.mbtn-ok{background:#0e639c;color:#fff}
.mbtn-del{background:#dc2626;color:#fff}
.mbtn-cancel{background:#3a3a3c;color:#ccc}

@media print{
  .sidebar,.topbar,.statusbar{display:none!important}
  .app,.main{display:block!important}
  .editor{color:#000!important;font-size:12pt!important;padding:30px!important;white-space:pre-wrap!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-top"><span>Files</span></div>
    <div class="file-list" id="fileList"></div>
    <button class="new-btn" onclick="openCreate()">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      New File
    </button>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="tab-name" id="tabName">note</div>
      <div class="toolbar">
        <select class="tb-select" onchange="setFontSize(this.value)" title="Font size">
          <option value="">Size</option>
          <option value="11px">11</option><option value="12px">12</option>
          <option value="14px">14</option><option value="16px">16</option>
          <option value="18px">18</option><option value="22px">22</option>
          <option value="28px">28</option><option value="36px">36</option>
        </select>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="cmd('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="tb-btn" onclick="cmd('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
        <button class="tb-btn" onclick="cmd('underline')" title="Underline (Ctrl+U)"><u>U</u></button>
        <button class="tb-btn" onclick="cmd('strikeThrough')" title="Strikethrough"><s>S</s></button>
        <button class="tb-btn" onclick="doHighlight()" title="Highlight">HL</button>
        <input class="tb-color" type="color" onchange="setColor(this.value)" title="Text color" value="#ff6b6b">
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="cmd('insertUnorderedList')" title="Bullet list">• List</button>
        <button class="tb-btn" onclick="addImage()" title="Insert image">IMG</button>
        <button class="tb-btn" onclick="printPage()" title="Print / Save PDF">PDF</button>
        <div class="tb-sep"></div>

        <!-- ── SOUND BUTTON ── -->
        <div class="sfx-wrap" id="sfxWrap">
          <button class="sfx-btn" id="sfxBtn" onclick="toggleSfxPanel(event)" title="Keyboard Sound Settings">
            <span class="sfx-dot" id="sfxDot"></span>
            <span id="sfxLabel">SFX</span>
          </button>
          <div class="sfx-panel" id="sfxPanel">
            <!-- toggle -->
            <div class="sfx-toggle-row">
              <span class="sfx-toggle-label">Keyboard Sound</span>
              <label class="sfx-switch">
                <input type="checkbox" id="sfxToggle" onchange="onSfxToggle(this.checked)">
                <span class="sfx-slider-track"></span>
                <span class="sfx-slider-thumb"></span>
              </label>
            </div>
            <!-- head -->
            <div class="sfx-panel-head">
              Sound Profile
              <span id="sfxActiveName">—</span>
            </div>
            <!-- profile list -->
            <div class="sfx-profiles" id="sfxProfiles"></div>
            <!-- volume -->
            <div class="sfx-footer">
              <label>VOL</label>
              <input type="range" id="sfxVol" min="0" max="100" value="80" oninput="onVolChange(this.value)">
              <span class="sfx-vol-val" id="sfxVolVal">80%</span>
            </div>
          </div>
        </div>
        <!-- ── END SOUND ── -->

      </div>
    </div>

    <div class="editor-wrap" id="editorWrap">
      <div id="editor" class="editor" contenteditable="true"
           data-placeholder="เริ่มพิมพ์ได้เลย... (Ctrl+B Bold · Ctrl+I Italic · Ctrl+S Save · Ctrl+N ไฟล์ใหม่)">
      </div>
    </div>

    <div class="statusbar">
      <span class="status-item save-ok" id="saveStatus">Saved</span>
      <span class="status-item" id="wordCount">0 words</span>
      <span class="status-item" id="cursorPos">Ln 1</span>
      <span class="status-item" id="charCount">0 chars</span>
      <span class="status-item" id="sfxStatus" style="margin-left:auto"></span>
    </div>
  </div>
</div>

<input type="file" id="imageInput" accept="image/*" hidden multiple>

<!-- Create modal -->
<div class="overlay" id="createModal">
  <div class="modal">
    <div class="modal-head">สร้างไฟล์ใหม่</div>
    <div class="modal-body"><input id="nameInput" placeholder="ชื่อไฟล์" autocomplete="off"></div>
    <div class="modal-foot">
      <button class="mbtn mbtn-cancel" onclick="closeModals()">ยกเลิก</button>
      <button class="mbtn mbtn-ok" onclick="confirmCreate()">ตกลง</button>
    </div>
  </div>
</div>

<!-- Delete modal -->
<div class="overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-head">ยืนยันการลบ</div>
    <div class="modal-body" id="deleteText" style="color:#ccc;font-size:13px;line-height:1.6"></div>
    <div class="modal-foot">
      <button class="mbtn mbtn-cancel" onclick="closeModals()">ยกเลิก</button>
      <button class="mbtn mbtn-del" onclick="confirmDelete()">ลบ</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   MULTI-PROFILE AUDIO ENGINE
   ═══════════════════════════════════════════════════════════════ */
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let masterGain = null;
let masterVol = 0.80;

function getACtx() {
  if (!actx) {
    actx = new AudioCtx();
    masterGain = actx.createGain();
    masterGain.gain.value = masterVol;
    masterGain.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

/* ── SOUND PROFILES ──────────────────────────────────────────── */
const SFX_PROFILES = [
  {
    id: 'galaxy',
    name: 'Dekey Galaxy 100 V2',
    desc: 'Gasket · Linear · Foam — deep thock',
    icon: '🌌', badge: 'THOCK', badgeColor: '#7ee787',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      // Sub-thud
      sine(ctx, dest, t, isSpecial?58:(72+rnd(18)), 0.55*pitch, 0.003, 0.058, 0.52*vel, 0.55);
      // Noise body
      noise(ctx, dest, t, 0.035, isSpecial?140:170, isSpecial?320:(380+rnd(80)), 0.9, 0.002, 0.036, 0.38*vel);
      // Triangle mid
      tri(ctx, dest, t, isSpecial?210:(260+rnd(60)), 0.75*pitch, 0.004, 0.048, 0.18*vel, pitch);
      // Case ping
      sine(ctx, dest, t, 2500, 1200, 0.001, 0.020, 0.045*vel, 1, true);
      if (isSpecial) stabRattle(ctx, dest, t, 280, 0.12*vel);
    }
  },
  {
    id: 'holy_panda',
    name: 'Holy Pandas',
    desc: 'Tactile bump · Round thock · POM plate',
    icon: '🐼', badge: 'TACTILE', badgeColor: '#60a5fa',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      // Tactile mid-freq body
      sine(ctx, dest, t, isSpecial?80:(95+rnd(15)), 0.6*pitch, 0.002, 0.07, 0.48*vel, 0.5);
      // Pre-travel snap (the tactile click layer)
      sine(ctx, dest, t, 1800, 900, 0.0005, 0.012, 0.12*vel, 1, true);
      // Bottom-out thud
      noise(ctx, dest, t, 0.030, 200, 450, 1.2, 0.002, 0.030, 0.42*vel);
      // Mid warmth
      tri(ctx, dest, t, isSpecial?180:(220+rnd(40)), 0.8*pitch, 0.005, 0.055, 0.22*vel, pitch);
      if (isSpecial) stabRattle(ctx, dest, t, 260, 0.10*vel);
    }
  },
  {
    id: 'topre',
    name: 'HHKB Topre 45g',
    desc: 'Electrostatic capacitive · Soft dome thock',
    icon: '⌨️', badge: 'TOPRE', badgeColor: '#c084fc',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      // Dome collapse — soft low thud
      sine(ctx, dest, t, isSpecial?65:(78+rnd(10)), 0.5*pitch, 0.001, 0.10, 0.44*vel, 0.45);
      // Dome snap — subtle mid crack
      noise(ctx, dest, t, 0.018, 300, 600, 2.0, 0.001, 0.018, 0.22*vel);
      // PCB resonance
      sine(ctx, dest, t, 3200, 1400, 0.0005, 0.015, 0.06*vel, 1, true);
      // Case thud
      tri(ctx, dest, t, isSpecial?170:(200+rnd(30)), 0.7*pitch, 0.004, 0.065, 0.20*vel, pitch);
    }
  },
  {
    id: 'mx_blue',
    name: 'Cherry MX Blue',
    desc: 'Click bar · Sharp clack · Classic gaming',
    icon: '🔵', badge: 'CLICKY', badgeColor: '#38bdf8',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      // Click bar snap — sharp transient
      sine(ctx, dest, t, 4200, 2200, 0.0003, 0.010, 0.55*vel, 1, true);
      // Body thud
      sine(ctx, dest, t, isSpecial?100:(110+rnd(20)), 0.55*pitch, 0.002, 0.045, 0.35*vel, 0.5);
      // Noise burst (the "clack")
      noise(ctx, dest, t, 0.020, 400, 3000, 0.6, 0.001, 0.020, 0.40*vel);
      // Bottom-out
      tri(ctx, dest, t, isSpecial?240:(280+rnd(50)), 0.8*pitch, 0.003, 0.035, 0.15*vel, pitch);
      if (isSpecial) stabRattle(ctx, dest, t, 200, 0.18*vel);
    }
  },
  {
    id: 'alpaca',
    name: 'Alpacas Lubed',
    desc: 'Buttery linear · Brass plate · POM housing',
    icon: '🦙', badge: 'LINEAR', badgeColor: '#fb923c',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      // Very soft bottom-out
      sine(ctx, dest, t, isSpecial?60:(68+rnd(12)), 0.45*pitch, 0.003, 0.090, 0.38*vel, 0.4);
      // Smooth noise body (lubed = minimal friction noise)
      noise(ctx, dest, t, 0.028, 180, 360, 0.7, 0.003, 0.028, 0.28*vel);
      // Brass plate resonance — subtle ping
      sine(ctx, dest, t, 2200, 1600, 0.001, 0.025, 0.08*vel, 1, true);
      // Warmth
      tri(ctx, dest, t, isSpecial?190:(230+rnd(40)), 0.7*pitch, 0.005, 0.070, 0.25*vel, pitch);
    }
  },
  {
    id: 'boba_u4',
    name: 'Boba U4 Silent',
    desc: 'Silent tactile · Dampened bump · Office-safe',
    icon: '🫧', badge: 'SILENT', badgeColor: '#a3e635',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      // Muffled thud — silenced bottom-out
      sine(ctx, dest, t, isSpecial?70:(82+rnd(10)), 0.4*pitch, 0.004, 0.120, 0.35*vel, 0.35);
      // Minimal noise — dampening pads absorb most
      noise(ctx, dest, t, 0.022, 150, 280, 0.5, 0.004, 0.022, 0.15*vel);
      // Very soft tactile bump at ~10ms
      const osc = actx.createOscillator();
      const g = actx.createGain();
      osc.type = 'sine'; osc.frequency.value = 1400;
      g.gain.setValueAtTime(0, t+0.010);
      g.gain.linearRampToValueAtTime(0.06*vel, t+0.012);
      g.gain.exponentialRampToValueAtTime(0.001, t+0.018);
      osc.connect(g); g.connect(dest);
      osc.start(t+0.010); osc.stop(t+0.022);
      // Body
      tri(ctx, dest, t, isSpecial?160:(190+rnd(30)), 0.6*pitch, 0.006, 0.090, 0.18*vel, pitch);
    }
  },
  {
    id: 'ibm_model_m',
    name: 'IBM Model M',
    desc: 'Buckling spring · Vintage legend · Loud & proud',
    icon: '🏛️', badge: 'BUCKLING', badgeColor: '#fbbf24',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      // Spring ping — the signature "clack"
      sine(ctx, dest, t, 5500, 2800, 0.0003, 0.008, 0.65*vel, 1, true);
      // Heavy barrel thud
      sine(ctx, dest, t, isSpecial?85:(100+rnd(20)), 0.5*pitch, 0.001, 0.050, 0.50*vel, 0.5);
      // Loud noise burst
      noise(ctx, dest, t, 0.025, 300, 4000, 0.5, 0.001, 0.025, 0.55*vel);
      // Metal barrel resonance
      tri(ctx, dest, t, isSpecial?280:(320+rnd(60)), 0.75*pitch, 0.002, 0.038, 0.28*vel, pitch);
      if (isSpecial) stabRattle(ctx, dest, t, 220, 0.22*vel);
    }
  },
  {
    id: 'gateron_yellow',
    name: 'Gateron Yellow Lubed',
    desc: 'Hyper-smooth linear · Low spring weight',
    icon: '🟡', badge: 'LINEAR', badgeColor: '#facc15',
    play(ctx, dest, isSpecial, vel, pitch) {
      const t = ctx.currentTime;
      // Very minimal — smooth and quiet
      sine(ctx, dest, t, isSpecial?55:(65+rnd(12)), 0.4*pitch, 0.004, 0.100, 0.32*vel, 0.38);
      noise(ctx, dest, t, 0.020, 160, 300, 0.6, 0.004, 0.020, 0.20*vel);
      sine(ctx, dest, t, 1800, 1200, 0.001, 0.018, 0.04*vel, 1, true);
      tri(ctx, dest, t, isSpecial?175:(210+rnd(35)), 0.65*pitch, 0.005, 0.075, 0.22*vel, pitch);
    }
  },
];

/* ── SHARED AUDIO PRIMITIVES ──────────────────────────────────── */
function rnd(n){ return Math.random()*n; }

function sine(ctx, dest, t, freqStart, freqEnd, attack, decay, vol, pitchMod, hiFreq=false){
  const osc = ctx.createOscillator();
  const g   = ctx.createGain();
  osc.type = hiFreq ? 'sine' : 'sine';
  osc.frequency.setValueAtTime(freqStart * pitchMod, t);
  if(freqEnd !== freqStart)
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd * pitchMod), t + (hiFreq ? decay : decay*0.6));
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + decay + 0.01);
}

function tri(ctx, dest, t, freq, freqRatio, attack, decay, vol, pitchMod){
  const osc = ctx.createOscillator();
  const g   = ctx.createGain();
  osc.type  = 'triangle';
  osc.frequency.setValueAtTime(freq * pitchMod, t);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * pitchMod * freqRatio), t + decay);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  osc.connect(g); g.connect(dest);
  osc.start(t); osc.stop(t + decay + 0.01);
}

function noise(ctx, dest, t, dur, hpFreq, lpFreq, lpQ, attack, decay, vol){
  const bufLen = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, bufLen, ctx.sampleRate);
  const d   = buf.getChannelData(0);
  for(let i=0;i<bufLen;i++) d[i] = Math.random()*2-1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const hp  = ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=hpFreq;
  const lp  = ctx.createBiquadFilter(); lp.type='lowpass';  lp.frequency.value=lpFreq; lp.Q.value=lpQ;
  const g   = ctx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(dest);
  src.start(t); src.stop(t + dur + 0.01);
}

function stabRattle(ctx, dest, t, lpFreq, vol){
  const bufS = ctx.createBuffer(1, Math.floor(ctx.sampleRate*0.028), ctx.sampleRate);
  const dS   = bufS.getChannelData(0);
  for(let i=0;i<dS.length;i++) dS[i] = (Math.random()*2-1)*0.6;
  const ns  = ctx.createBufferSource(); ns.buffer = bufS;
  const lpf = ctx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=lpFreq;
  const g   = ctx.createGain();
  g.gain.setValueAtTime(0, t+0.004);
  g.gain.linearRampToValueAtTime(vol, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.001, t+0.032);
  ns.connect(lpf); lpf.connect(g); g.connect(dest);
  ns.start(t+0.004); ns.stop(t+0.036);
}

/* ── PLAY KEY ───────────────────────────────────────────────────── */
let soundOn = localStorage.getItem('cn_sfx') !== 'off';
let activeProfileId = localStorage.getItem('cn_sfx_profile') || 'galaxy';

function playKey(isSpecial) {
  if (!soundOn) return;
  try {
    const ctx = getACtx();
    const vel   = 0.78 + Math.random()*0.22;
    const pitch = 1 + (Math.random()-0.5)*0.08;
    const prof  = SFX_PROFILES.find(p=>p.id===activeProfileId) || SFX_PROFILES[0];
    prof.play(ctx, masterGain, isSpecial, vel, pitch);
  } catch(e) { /* silent fail */ }
}

/* ═══════════════════════════════════════════════════════════════
   SOUND PANEL UI
   ═══════════════════════════════════════════════════════════════ */
function buildSfxPanel() {
  const container = document.getElementById('sfxProfiles');
  SFX_PROFILES.forEach(p => {
    const el = document.createElement('div');
    el.className = 'sfx-profile' + (p.id===activeProfileId?' active':'');
    el.id = 'sfxp-' + p.id;
    el.style.setProperty('--pfx-color', p.badgeColor);
    el.innerHTML = `
      <div class="sfx-profile-icon" style="background:${p.badgeColor}18">${p.icon}</div>
      <div class="sfx-profile-info">
        <div class="sfx-profile-name">${p.name}</div>
        <div class="sfx-profile-desc">${p.desc}</div>
      </div>
      <span class="sfx-profile-badge" style="color:${p.badgeColor};border-color:${p.badgeColor}">${p.badge}</span>
    `;
    el.onclick = () => selectProfile(p.id, true);
    container.appendChild(el);
  });
  updateSfxUI();
}

function selectProfile(id, preview=false) {
  activeProfileId = id;
  localStorage.setItem('cn_sfx_profile', id);
  document.querySelectorAll('.sfx-profile').forEach(el=>{
    const pid = el.id.replace('sfxp-','');
    const p   = SFX_PROFILES.find(x=>x.id===pid);
    el.classList.toggle('active', pid===id);
    if(p) el.style.setProperty('--pfx-color', p.badgeColor);
  });
  updateSfxUI();
  if (preview && soundOn) {
    // play 3 preview taps
    [0, 80, 150].forEach(d => setTimeout(()=>playKey(false), d));
  }
}

function onSfxToggle(checked) {
  soundOn = checked;
  localStorage.setItem('cn_sfx', checked ? 'on' : 'off');
  updateSfxUI();
  if (checked) { getACtx(); playKey(false); }
}

function onVolChange(val) {
  masterVol = val/100;
  document.getElementById('sfxVolVal').textContent = val + '%';
  if (masterGain) masterGain.gain.value = masterVol;
}

function updateSfxUI() {
  const prof = SFX_PROFILES.find(p=>p.id===activeProfileId) || SFX_PROFILES[0];
  const btn  = document.getElementById('sfxBtn');
  const dot  = document.getElementById('sfxDot');
  const lbl  = document.getElementById('sfxLabel');
  const tog  = document.getElementById('sfxToggle');
  const activeName = document.getElementById('sfxActiveName');
  const statusEl   = document.getElementById('sfxStatus');

  tog.checked = soundOn;
  dot.style.background = soundOn ? prof.badgeColor : '#555';
  dot.style.boxShadow  = soundOn ? `0 0 5px ${prof.badgeColor}88` : 'none';
  btn.classList.toggle('on', soundOn);
  lbl.textContent = soundOn ? prof.icon + ' SFX' : 'SFX';
  activeName.textContent = soundOn ? prof.name : 'OFF';
  statusEl.textContent   = soundOn ? `♪ ${prof.name}` : '';
  statusEl.style.color   = soundOn ? prof.badgeColor+'cc' : '';
}

let sfxPanelOpen = false;
function toggleSfxPanel(e) {
  e.stopPropagation();
  sfxPanelOpen = !sfxPanelOpen;
  document.getElementById('sfxPanel').classList.toggle('open', sfxPanelOpen);
}

document.addEventListener('click', e => {
  if (sfxPanelOpen && !document.getElementById('sfxWrap').contains(e.target)) {
    sfxPanelOpen = false;
    document.getElementById('sfxPanel').classList.remove('open');
  }
});

/* ═══════════════════════════════════════════════════════════════
   FILE SYSTEM
   ═══════════════════════════════════════════════════════════════ */
let files = {};
try { files = JSON.parse(localStorage.getItem('cn_files') || '{}'); } catch(e) { files = {}; }
let currentFile = null;
let deleteTarget = null;
let saveTimer = null;
let isDirty = false;

const editor     = document.getElementById('editor');
const fileList   = document.getElementById('fileList');
const tabName    = document.getElementById('tabName');
const imageInput = document.getElementById('imageInput');
const saveStatus = document.getElementById('saveStatus');

function scheduleSave() {
  isDirty = true; setStatus('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 800);
}
function doSave() {
  if (!currentFile || !isDirty) return;
  files[currentFile] = editor.innerHTML;
  try { localStorage.setItem('cn_files', JSON.stringify(files)); } catch(e) { setStatus('error'); return; }
  isDirty = false; setStatus('saved');
}
function setStatus(s) {
  if (s==='saving') { saveStatus.textContent='Saving...'; saveStatus.className='status-item saving'; }
  else if (s==='error') { saveStatus.textContent='Save failed'; saveStatus.className='status-item'; saveStatus.style.color='#ef4444'; }
  else { saveStatus.textContent='Saved'; saveStatus.className='status-item save-ok'; }
}

let metricsTimer = null;
function scheduleMetrics() {
  if (metricsTimer) return;
  metricsTimer = setTimeout(() => { updateMetrics(); metricsTimer=null; }, 250);
}
function updateMetrics() {
  const text  = editor.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('wordCount').textContent = words.toLocaleString() + ' words';
  document.getElementById('charCount').textContent = text.length.toLocaleString() + ' chars';
}

function renderFiles() {
  fileList.innerHTML = '';
  Object.keys(files).forEach(n => {
    const d = document.createElement('div');
    d.className = 'file-item' + (n===currentFile?' active':'');
    const s = n.replace(/'/g,"\\'");
    d.innerHTML = `<span class="name" title="${n}" onclick="openFile('${s}')">📄 ${n}</span>
                   <span class="del" onclick="askDelete('${s}')" title="ลบ">✕</span>`;
    fileList.appendChild(d);
  });
}
function openFile(n) {
  if (n===currentFile) return;
  doSave(); currentFile=n;
  editor.innerHTML = files[n]||'';
  tabName.textContent = n; isDirty=false; setStatus('saved');
  renderFiles(); attachResizeAll(); updateMetrics(); editor.focus();
}

/* ─── KEYBOARD ─────────────────────────────────────────── */
editor.addEventListener('keydown', e => {
  const special = e.key==='Enter'||e.key==='Backspace'||e.key==='Delete'||e.key===' ';
  playKey(special);
  if (e.key==='Tab') { e.preventDefault(); document.execCommand('insertText',false,'    '); }
});
editor.addEventListener('input', () => { scheduleSave(); scheduleMetrics(); });

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey||e.metaKey;
  if (mod&&e.key==='s') { e.preventDefault(); doSave(); }
  if (mod&&e.key==='n') { e.preventDefault(); openCreate(); }
  if (e.key==='Escape') { closeModals(); sfxPanelOpen=false; document.getElementById('sfxPanel').classList.remove('open'); }
  if (e.key==='Enter' && document.getElementById('createModal').classList.contains('show')) { e.preventDefault(); confirmCreate(); }
});

document.addEventListener('selectionchange', () => {
  try {
    const sel = window.getSelection();
    if (!sel||!sel.rangeCount) return;
    const r = sel.getRangeAt(0).cloneRange();
    r.selectNodeContents(editor);
    r.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
    document.getElementById('cursorPos').textContent = 'Ln ' + r.toString().split('\n').length;
  } catch(e) {}
});

/* ─── TEXT FORMATTING ──────────────────────────────────── */
function cmd(c) { editor.focus(); document.execCommand(c,false,null); }
function setFontSize(size) {
  if (!size) return;
  const sel = window.getSelection();
  if (!sel||!sel.rangeCount||sel.getRangeAt(0).collapsed) return;
  const span = document.createElement('span'); span.style.fontSize=size;
  try { sel.getRangeAt(0).surroundContents(span); scheduleSave(); } catch(e) {}
}
function setColor(color) {
  const sel = window.getSelection();
  if (!sel||!sel.rangeCount||sel.getRangeAt(0).collapsed) return;
  const span = document.createElement('span'); span.style.color=color;
  try { sel.getRangeAt(0).surroundContents(span); scheduleSave(); } catch(e) {}
}
function doHighlight() {
  const sel = window.getSelection();
  if (!sel||!sel.rangeCount||sel.getRangeAt(0).collapsed) return;
  const mark = document.createElement('mark');
  mark.style.cssText='background:#fef08a;color:#1a1a1b;border-radius:2px;padding:0 1px';
  try { sel.getRangeAt(0).surroundContents(mark); scheduleSave(); } catch(e) {}
}

/* ─── IMAGE HANDLING ──────────────────────────────────── */
function addImage() { editor.focus(); imageInput.value=''; imageInput.click(); }
imageInput.onchange = e => Array.from(e.target.files).forEach(insertImageFile);
function insertImageFile(file) {
  const r = new FileReader();
  r.onload = () => insertImageSrc(r.result,'180px');
  r.readAsDataURL(file);
}
function insertImageSrc(src, width) {
  width = width||'180px';
  const box = buildImgBox(src,width);
  const sel = window.getSelection();
  if (sel&&sel.rangeCount) { const range=sel.getRangeAt(0); range.collapse(false); range.insertNode(box); }
  else editor.appendChild(box);
  enableResize(box.querySelector('img'), box.querySelector('.handle'));
  scheduleSave();
}
function buildImgBox(src,width) {
  const box = document.createElement('span'); box.className='img-box'; box.contentEditable='false';
  const img = document.createElement('img'); img.src=src; img.style.width=width; img.style.maxWidth='100%';
  const handle = document.createElement('span'); handle.className='handle'; handle.title='ลากเพื่อปรับขนาด';
  const del = document.createElement('span'); del.className='del-img'; del.textContent='✕'; del.title='ลบรูป';
  del.onclick = () => { box.remove(); scheduleSave(); };
  box.appendChild(img); box.appendChild(handle); box.appendChild(del);
  return box;
}
function enableResize(img, handle) {
  handle.onmousedown = e => {
    e.preventDefault();
    const startX=e.clientX, startW=img.offsetWidth;
    const onMove = ev => img.style.width = Math.max(40, startW+(ev.clientX-startX))+'px';
    const onUp   = () => { document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); scheduleSave(); };
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  };
}
function attachResizeAll() {
  document.querySelectorAll('.img-box').forEach(b => enableResize(b.querySelector('img'), b.querySelector('.handle')));
}

/* ─── DRAG & DROP ─────────────────────────────────────── */
const editorWrap = document.getElementById('editorWrap');
editorWrap.addEventListener('dragover', e => { e.preventDefault(); editorWrap.classList.add('dragover'); });
editorWrap.addEventListener('dragleave', e => { if(!editorWrap.contains(e.relatedTarget)) editorWrap.classList.remove('dragover'); });
editorWrap.addEventListener('drop', e => {
  e.preventDefault(); editorWrap.classList.remove('dragover');
  const imgs = Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
  imgs.forEach(insertImageFile);
  if (!imgs.length) {
    const url = e.dataTransfer.getData('text/uri-list')||e.dataTransfer.getData('text/plain');
    if (url&&/\.(png|jpe?g|gif|webp|svg|bmp)(\?.*)?$/i.test(url)) insertImageSrc(url,'200px');
  }
});
editor.addEventListener('paste', e => {
  const items = e.clipboardData&&e.clipboardData.items;
  if (!items) return;
  for (const item of items) { if (item.type.startsWith('image/')) { e.preventDefault(); insertImageFile(item.getAsFile()); return; } }
});

/* ─── MODALS ──────────────────────────────────────────── */
function openCreate() {
  document.getElementById('createModal').classList.add('show');
  setTimeout(() => { const i=document.getElementById('nameInput'); i.value=''; i.style.borderColor=''; i.focus(); }, 60);
}
function askDelete(n) {
  deleteTarget = n;
  document.getElementById('deleteText').innerHTML = `ลบไฟล์ <b style="color:#fff">"${n}"</b> ?<br><span style="color:#888;font-size:12px">การกระทำนี้ไม่สามารถย้อนกลับได้</span>`;
  document.getElementById('deleteModal').classList.add('show');
}
function closeModals() {
  document.getElementById('createModal').classList.remove('show');
  document.getElementById('deleteModal').classList.remove('show');
}
['createModal','deleteModal'].forEach(id => {
  document.getElementById(id).addEventListener('click', function(e) { if(e.target===this) closeModals(); });
});
function confirmCreate() {
  const inp=document.getElementById('nameInput'), n=inp.value.trim();
  if (!n) { inp.style.borderColor='#ef4444'; inp.focus(); return; }
  if (files[n]!==undefined) { inp.style.borderColor='#f59e0b'; inp.focus(); return; }
  files[n]=''; try { localStorage.setItem('cn_files',JSON.stringify(files)); } catch(e) {}
  closeModals(); openFile(n);
}
function confirmDelete() {
  if (!deleteTarget) return;
  delete files[deleteTarget]; try { localStorage.setItem('cn_files',JSON.stringify(files)); } catch(e) {}
  closeModals();
  const keys=Object.keys(files);
  if (keys.length) openFile(keys[0]);
  else { currentFile=null; editor.innerHTML=''; tabName.textContent=''; renderFiles(); setStatus('saved'); updateMetrics(); }
}

function printPage() { doSave(); window.print(); }

/* ─── PWA ─────────────────────────────────────────────── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/Note/sw.js').catch(()=>{}));
}

/* ─── INIT ────────────────────────────────────────────── */
if (Object.keys(files).length===0) {
  files['note'] = [
    '<p><b>ยินดีต้อนรับสู่ CodeNote ✦</b></p>',
    '<p>เสียงคีบอร์ดหลายโปรไฟล์ — คลิก <b>SFX</b> ที่แถบบน เพื่อเลือกเสียง</p>',
    '<p>&nbsp;</p>',
    '<p><b>Sound Profiles ที่มี:</b></p>',
    '<p>🌌 Dekey Galaxy 100 V2 · 🐼 Holy Pandas · ⌨️ HHKB Topre</p>',
    '<p>🔵 Cherry MX Blue · 🦙 Alpacas Lubed · 🫧 Boba U4 Silent</p>',
    '<p>🏛️ IBM Model M · 🟡 Gateron Yellow</p>',
    '<p>&nbsp;</p>',
    '<p><b>Shortcuts:</b></p>',
    '<p>• <b>Ctrl+B/I/U</b> — Bold / Italic / Underline</p>',
    '<p>• <b>Ctrl+S</b> — Save · <b>Ctrl+N</b> — ไฟล์ใหม่ · <b>Tab</b> — indent</p>',
    '<p>• ลากรูปมาวางได้โดยตรง 📷</p>'
  ].join('');
  try { localStorage.setItem('cn_files',JSON.stringify(files)); } catch(e) {}
}

buildSfxPanel();
openFile(Object.keys(files)[0]);
